[package]
name = "cian-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cian's notes, behind a C ABI, for platforms that cannot run the engine"

[lib]
# `staticlib` is what an Xcode target links; `rlib` is what `cargo test` needs,
# and the tests here are the only place this code is ever run on a machine
# that can run it.
crate-type = ["staticlib", "rlib"]

[dependencies]
# **No desktop features.** There is no trash on a phone, and a core that
# always wants one cannot be built for one.
# **cian-core はもう要らない。** 2026-09-05 に切った ── それまで iPhone は
# git も svn も SharePoint も差分もアーカイバも積んでいた（18,128 行）。
amber-core = { path = "../amber-core" }
anyhow = { workspace = true }
serde_json = { workspace = true }
# Only for the two date fields the reminder methods hand across.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
