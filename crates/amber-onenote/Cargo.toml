[package]
name = "amber-onenote"
version.workspace = true
edition.workspace = true
# 借りた読み手（onenote_parser 2.0）が 1.85 を要る ── 束の 1.75 では建たない。
rust-version = "1.85"
license.workspace = true
description = "OneNote が書き出したものを、ambər の読める Markdown に"

# **読むのは外部クレート**（依頼 621・本人「自前で全部実装するより先人の知恵を
# 拝借したい」）。自前の読み手（`scripts/onestore.py`）は公開仕様しか読めず、
# 本物のサンプルでは 0 ページだった ── `onenote_parser` は FSSHTTP 包みも
# `.onepkg`（CAB）も読む。**書くところだけ自前**（Markdown と ambər の決まり）。
#
# デスクトップでだけ使う（`amber-core` の `desktop` から）── iPhone のバンドルには入らない。
[dependencies]
# **写しを見る**（依頼 636）── `crates/vendor/onenote_parser`。本家 2.0.0 に
# 一つだけ直しを当ててある（`PATCHES.ja.md` に何をなぜ直したかを書いてある）。
onenote_parser = { path = "../vendor/onenote_parser", default-features = false, features = ["onepkg"] }
# `native-fs` は入れない ── Windows でドライブ名のパスを断る（lib.rs の `StdFs`）。
typed-path = "0.12"
anyhow = { workspace = true }

# 試験で本物の `.onepkg`（CAB）を組む ── パーサーが中で使っているのと同じもの。
[dev-dependencies]
cab = "0.6"
