[package]
name = "cian-lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lua configuration host for cian (mlua): keymaps, themes, ext-open DSL"

[dependencies]
# Lua 5.4 embedded (vendored) so cian stays a single self-contained binary
# with no external Lua dependency. Default (non-send) features keep the runtime
# single-threaded, which is all the TUI needs.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# For the count.lua loader, which returns cian_core::count::Options directly.
cian-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
