[package]
name = "cian-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain logic for cian: file operations, marks, history, bookmarks, masks, search"

[dependencies]
anyhow   = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dunce = "1.0.5"
# Text decoding for the viewer (Shift_JIS / UTF-16 …). Pure Rust, the same
# engine Firefox uses; no C dependency, so the Windows build stays clean.
encoding_rs = "0.8"
# Cross-platform free/total disk space for `:df`. Tiny, uses the OS call
# directly (statvfs / GetDiskFreeSpaceEx) rather than shelling out.
fs2 = "0.4.3"
fs_extra = { workspace = true }
md-5 = { version = "0.10.6", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
# `coinit_apartmentthreaded` is not optional on Windows: trash fails to compile
# without one of its coinit_* features, and the Shell file APIs it calls want an
# apartment-threaded COM runtime. Default features are otherwise off because the
# `chrono` one only powers trash's listing/restore API, which cian does not use.
trash = { version = "5.2.3", default-features = false, features = ["coinit_apartmentthreaded"] }
# `aes-crypto` powers password-protected zip creation. The traditional
# ZipCrypto cipher would be openable by Explorer's built-in unzip but is
# cryptographically broken and not exposed by the crate's public API, so AES
# is the only real choice; the UI warns that Explorer cannot open the result.
zip = { version = "4.2.0", default-features = false, features = ["deflate", "aes-crypto"] }
# tar + gzip reading, for looking inside .tar / .tar.gz / .tgz. flate2's
# rust_backend (miniz_oxide) keeps this pure-Rust — no C, so the single Windows
# binary still builds without a toolchain.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.27.0"
