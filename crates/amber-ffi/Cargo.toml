[package]
name = "amber-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "amber — Markdown のノートを、C ABI の向こうへ。エンジンを走らせられない場所のために"

[lib]
# `staticlib` は Xcode のターゲットがリンクするもの、`rlib` は `cargo test` が
# 要るもの。**両方入れる** ── ここの試験は、このコードが「走らせられる端末で
# 実際に走る」唯一の場所なので。
crate-type = ["staticlib", "rlib"]

[dependencies]
# **机の機能は入れない。** iPhone にゴミ箱は無く、いつもそれを欲しがる core は
# iPhone 向けに建たない。
amber-core = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
# リマインダーが受け渡す 2 つの日付の欄のためだけ。
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
