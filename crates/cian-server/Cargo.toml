[package]
name = "cian-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cian-core = { workspace = true }
# The shell lives here rather than in the window. Electron's usual answer is
# node-pty — a native module needing a C++ toolchain and a rebuild against
# Electron's ABI, which is exactly the several gigabytes this project refused
# for SFTP. cian-pty is portable-pty and vt100, both plain Rust, and it is the
# same terminal emulator the terminal build reads its shell through. One
# emulator, and no compiler on the machine that runs it.
cian-pty  = { workspace = true }
# SFTP. Pure Rust (russh), and already built for the Windows release because
# the terminal build carries it — so this costs the engine nothing new. The
# gigabytes once feared were for *building* on the offline machine, and that
# machine receives an exe.
cian-scp  = { workspace = true }
# The config paths and the remembered-state file — the same ones the terminal
# build uses, so a look chosen in one is the look the other opens with. mlua
# comes with it and compiles C, which the Windows release has been doing all
# along for cian-tui; the "no compiler" property was spent long before this.
cian-lua  = { workspace = true }
# The three AI commands the terminal build has. Same config, same prompts.
cian-ai   = { workspace = true }
regex     = "1.13.1"
vt100     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }

# The icon, stamped into the exe at link time. Windows-only and build-only.
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
