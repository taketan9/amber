<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self'; connect-src 'self'">
<!-- `worker-src` を足したのは Monaco のため。**無いと色分けが本体スレッドで
     走る** ── 動くので気づかないが、長いノートで窓が固まる。`script-src` が
     `worker-src` の代わりに使われ、Monaco は自分の worker を `blob:` で
     組み立てるので弾かれていた（`console-message` を端末へ流して初めて
     見えた）。通すのは `blob:` だけで、外の道は開けない。 -->
<title>ambər</title>
<style>
/* ── 色 ──
   既定は「琥珀」── アイコンと同じ色（packaging/amber-master.png）。窓と
   アプリで別の琥珀にすると、同じものに見えなくなる。

   **明暗を切り替えるのは OS。** 琥珀だけは `prefers-color-scheme` に従い、
   名前で選んだテーマは、選んだとおりに出る ── 「ayu-dark にしたのに昼は
   明るい」は、選んだことにならない。

   足すときは 15 の変数を全部埋める。**一つ抜けると、そこだけ前のテーマの
   色が残る**（変数は継承するので、抜けは崩れではなく“混ざり”として出る）。 */
:root {
  color-scheme: light;
  --amber:      #f0a52b;
  --amber-soft: #ffd97f;
  --amber-deep: #b5760f;
  --bg:      #fbf7ef;
  --rail:    #f3ecdf;
  --list:    #f8f3e8;
  --paper:   #fffdf8;
  --line:    #e4d9c4;
  --line-2:  #efe6d4;
  --ink:     #2a2011;
  --ink-2:   #6b5a41;
  --ink-3:   #9a8a6f;
  --sel:     #f7e2b6;
  --hover:   #f1e6cf;
  /* まとめて選んだ行。**琥珀ではない色**にする ── 「いま開いている一本」
     が琥珀なので、同じ色だと二つの意味が同じ顔になる。
     **一か所だけ書く。** 地（`--list`）に混ぜて作るので、テーマが六つ
     あっても、それぞれの紙の明るさに合う ── 六つに書き足すと、テーマを
     一つ足した日に一つだけ色の無い一覧ができる。 */
  --pick-seed:  #7fae4e;
  --pick:       color-mix(in srgb, var(--pick-seed) 20%, var(--list));
  --pick-hover: color-mix(in srgb, var(--pick-seed) 30%, var(--list));
  --pick-line:  color-mix(in srgb, var(--pick-seed) 72%, var(--list));
  /* 名札のシュワ。**明るい地では濃い琥珀** ── `--amber`（#f0a52b）は
     明るい黄橙で、白い紙の上の一文字だと薄れて沈む。テーマごとの
     「濃い琥珀」に乗せておけば、紙でもあゆでも、その画面の色になる。 */
  --brand-s: var(--amber-deep);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --bg:      #17140f;
    --rail:    #1d1913;
    --list:    #1a1611;
    --paper:   #14110c;
    --line:    #302a20;
    --line-2:  #262017;
    --ink:     #f0e7d6;
    --ink-2:   #bcac91;
    --ink-3:   #8a7d66;
    --sel:     #3b2f16;
    --hover:   #262017;
    /* **ここだけ名指しする。** OS まかせの暗い方は `--amber-deep` を
       上書きしていないので、明るい版の #b5760f が残っている ── 暗い紙の
       上ではただの焦げ茶になる。暗い地は `--amber` のほうが灯る。 */
    --brand-s: #f0a52b;
  }
}

/* 琥珀を名指しで（OS が暗くても明るいまま／暗いまま） */
:root[data-theme="amber-light"] {
  color-scheme: light;
  --amber: #f0a52b; --amber-soft: #ffd97f; --amber-deep: #b5760f;
  --bg: #fbf7ef; --rail: #f3ecdf; --list: #f8f3e8; --paper: #fffdf8;
  --line: #e4d9c4; --line-2: #efe6d4;
  --ink: #2a2011; --ink-2: #6b5a41; --ink-3: #9a8a6f;
  --sel: #f7e2b6; --hover: #f1e6cf;
}
:root[data-theme="amber-dark"] {
  color-scheme: dark;
  --amber: #f0a52b; --amber-soft: #ffd97f; --amber-deep: #e0a94e;
  --bg: #17140f; --rail: #1d1913; --list: #1a1611; --paper: #14110c;
  --line: #302a20; --line-2: #262017;
  --ink: #f0e7d6; --ink-2: #bcac91; --ink-3: #8a7d66;
  --sel: #3b2f16; --hover: #262017;
  /* 名札のシュワは `--amber-deep`（#e0a94e）ではなく `--amber` ──
     暗い紙の上では、落ち着いた方は引っ込む。灯るほうを採った。 */
  --brand-s: #f0a52b;
}

/* ayu ── 明るいほう。`--amber-deep` はリンクと升に乗るので、
   ayu の accent `#FF9940`（白の上で 2.1:1）ではなく読める濃さにする。 */
:root[data-theme="ayu-light"] {
  color-scheme: light;
  --amber: #ff9940; --amber-soft: #ffd9b3; --amber-deep: #a05a00;
  --bg: #f8f9fa; --rail: #f3f4f5; --list: #fcfcfc; --paper: #ffffff;
  --line: #dcdfe4; --line-2: #eaecef;
  --ink: #5c6166; --ink-2: #787b80; --ink-3: #8a9199;
  --sel: #ffe7d1; --hover: #eef0f2;
}
/* ayu ── 中間（mirage）。金は `#FFCC66`。 */
:root[data-theme="ayu-mirage"] {
  color-scheme: dark;
  --amber: #ffcc66; --amber-soft: #ffe0a3; --amber-deep: #ffcc66;
  --bg: #1f2430; --rail: #232834; --list: #1f2430; --paper: #242936;
  --line: #343b4d; --line-2: #2b3242;
  --ink: #cccac2; --ink-2: #a6a29a; --ink-3: #707a8c;
  --sel: #3d4457; --hover: #2b3242;
}
/* ayu ── 暗いほう。金は `#E6B450`（iPhone のアクセントと同じ）。 */
:root[data-theme="ayu-dark"] {
  color-scheme: dark;
  --amber: #e6b450; --amber-soft: #f2d59a; --amber-deep: #e6b450;
  --bg: #0b0e14; --rail: #0d1017; --list: #0b0e14; --paper: #0f131a;
  --line: #1f2430; --line-2: #171b24;
  --ink: #bfbdb6; --ink-2: #9a9891; --ink-3: #565b66;
  --sel: #26334d; --hover: #171b24;
}
/* 紙 ── 白と黒だけ。**刷るため、そして読むだけのため。**
   色で意味を運ばない画面が一つ要る ── 色が見えない人にも同じものが届く。 */
:root[data-theme="paper"] {
  color-scheme: light;
  --amber: #444444; --amber-soft: #dddddd; --amber-deep: #1a1a1a;
  --bg: #ffffff; --rail: #f6f6f6; --list: #fbfbfb; --paper: #ffffff;
  --line: #d4d4d4; --line-2: #e8e8e8;
  --ink: #111111; --ink-2: #444444; --ink-3: #767676;
  --sel: #ebebeb; --hover: #f2f2f2;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
/* **`hidden` は `display:flex` に負ける。** 属性は付いているのに出ている、
   という形で必ず一度は踏む（cian で踏んだ）。ここで勝たせておく。 */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  display: flex; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ── 左: 行き先 ── */
#rail {
  width: 208px; flex: none; display: flex; flex-direction: column;
  background: var(--rail); border-right: 1px solid var(--line);
  overflow-y: auto; padding-bottom: 12px;
}
/* **名前だけ置く。印は置かない。**
   長いあいだここは空だった ── アプリの名前は窓の外（Dock・タスクバー・
   ⌘Tab）が既に言っていて、中で二度言うとそのぶんノートが下がるので
   （依頼 175）。戻したのは、名前に**姿**ができたから ── 外したのは
   「アイコン＋ただの名前」で、あれは確かに二度言っているだけだった。
   `ambər` の綴りは、外のどこにも出ていない。

   **印は置かない**（本人の言葉で「くどい」）── 絵と字を並べると、
   同じことを二つの形で言うことになる。

   mac では**高さが変わらない**: 34px は信号機のぶんで既に空けてある。
   Windows と Linux は 14px しか無いので 30px へ伸ばす ── そこだけは
   一覧が 16px 下がる。承知のうえで本人が選んだ（Ｗ１）。

   帯そのものは掴んで動かす場所なので、字も一緒に掴める（`drag`）。 */
#railtop {
  height: 30px; flex: none; -webkit-app-region: drag;
  display: flex; align-items: center; padding: 0 14px;
}
/* 信号機（`hiddenInset`）は x=20 から並んで右端が 74 あたり ──
   その右に置く。詰めると、閉じるつもりの指が字に当たる。 */
body.mac #railtop { height: 34px; padding-left: 88px; }
#railtop .wm {
  font-size: 13px; font-weight: 600; color: var(--ink-3); letter-spacing: .01em;
}
/* 名札と同じ差し方（`--brand-s`）── 明るい地では濃い琥珀、暗い地では明るい琥珀。 */
#railtop .wm .s { color: var(--brand-s); }
/* **一つだけの、押させたいボタン ── ただし塊にはしない。**
   前は琥珀のべた塗りに階調と、琥珀色に光る影を二枚。古く見えていたのは
   色ではなく**塊であること**で、階調と影はその塊を立体に見せるための飾り
   だった。塊をやめ、琥珀は 22px の丸だけに残す ── 面積が小さいぶん色は
   強く効き、字も高さも列の他の行と揃うので、左の列が一本の並びとして
   読める。押せることは丸の形が言うので、地も枠も要らない。 */
#new {
  display: flex; align-items: center; gap: 9px; width: 100%;
  margin: 2px 0 4px; padding: 7px 14px;
  color: var(--ink); font-weight: 600; font-size: 13.5px;
  transition: background .12s;
}
#new .ring {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: var(--amber); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 3px color-mix(in srgb, var(--amber) 50%, transparent);
  transition: transform .08s;
}
#new .ring svg { width: 12px; height: 12px; }
/* 他の行と同じ光り方をする ── ここだけ別の反応をすると、列の中で
   この一行だけ別の作りに見える。 */
#new:hover { background: var(--hover); }
#new:active .ring { transform: scale(.9); }
.head {
  font-size: 10.5px; letter-spacing: .13em; color: var(--ink-3);
  padding: 12px 15px 4px; text-transform: uppercase;
}
.dest {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 14px; cursor: pointer; font-size: 13.5px;
  color: var(--ink-2); border-radius: 0;
}
.dest:hover { background: var(--hover); }
.dest.on { background: var(--sel); color: var(--ink); font-weight: 600; }
.dest .n { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* 行き先の印。**形で分ける** ── 色を付けたフォルダにだけ四角が出ていた
   頃は、色の無いフォルダとブックマークの棚が字の形しか違わなかった。
   色は形の上に載せる（色だけで分けない）。 */
.dest .mk { width: 15px; height: 15px; flex: none; color: var(--ink-3); }
.dest.on .mk { color: var(--amber-deep); }
.dest[data-kind="book"] .mk[style] { color: inherit; }
.dest .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dest[data-depth="1"] { padding-left: 28px; }
.dest[data-depth="2"] { padding-left: 42px; }

/* ── 中: ノートの一覧 ── */
#list {
  width: 336px; flex: none; display: flex; flex-direction: column;
  background: var(--list); border-right: 1px solid var(--line);
}
#listhead {
  padding: 14px 16px 10px; border-bottom: 1px solid var(--line-2);
  -webkit-app-region: drag;
}
body.mac #listhead { padding-top: 30px; }
#where { font-size: 15px; font-weight: 700; }
#count { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* 探す欄は**畳んでおく**。頭に置きっぱなしにすると、絞り込みの帯と
   合わせて毎回二段ぶん取る ── 言葉で探すのは、絞るより回数が少ない。 */
#tools {
  display: flex; align-items: center; gap: 10px; margin-top: 7px;
  -webkit-app-region: no-drag;
}
#tools button {
  font-size: 11.5px; color: var(--ink-3); padding: 1px 6px; border-radius: 6px;
}
#tools button:hover { background: var(--hover); color: var(--ink-2); }
#findbtn { display: inline-flex; align-items: center; gap: 4px; }
#findbtn svg { width: 12px; height: 12px; }
#findbtn.on { background: var(--sel); color: var(--ink); }
#order { margin-left: auto; }
#findbox {
  display: flex; align-items: center; gap: 4px; margin-top: 7px;
  -webkit-app-region: no-drag;
}
#findbox[hidden] { display: none !important; }
#find {
  flex: 1; min-width: 0; padding: 6px 10px; border-radius: 8px;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  font: inherit; font-size: 13px;
}
#find:focus { outline: 2px solid var(--amber); outline-offset: -1px; }
#findoff { color: var(--ink-3); padding: 2px 5px; border-radius: 6px; }
#findoff:hover { background: var(--hover); color: var(--ink); }

/* 絞り込みの帯。**絞れることが、絞る前から見えている** ── 「フィルタ」
   という言葉を覚えなくてよい。押すと下に開く。 */
#drawers {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px;
  -webkit-app-region: no-drag;
}
#drawers button {
  font-size: 11.5px; padding: 2.5px 9px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
}
#drawers button:hover { background: var(--hover); }
#drawers button.on {
  background: var(--amber); border-color: var(--amber-deep); color: #3a2408; font-weight: 600;
}
#drawers button.open { background: var(--sel); border-color: #e8caa0; color: var(--ink); }
#drawers button.clear { border-style: dashed; color: var(--ink-3); }

#drawer {
  flex: none; max-height: 46vh; overflow-y: auto; background: var(--paper);
  border-bottom: 1px solid var(--line-2); -webkit-app-region: no-drag;
}
#drawer[hidden] { display: none !important; }
#drawer .sec { padding: 9px 16px 3px; font-size: 11px; color: var(--ink-3); }
#drawer .it {
  display: flex; align-items: center; gap: 9px; padding: 5px 16px;
  font-size: 12.5px; width: 100%; text-align: left;
}
#drawer .it:hover { background: var(--hover); }
#drawer .it.on { background: var(--sel); }
#drawer .it .n { margin-left: auto; color: var(--ink-3); font-size: 11px; }
#drawer .bx {
  width: 14px; height: 14px; border: 1.4px solid var(--ink-3); border-radius: 3.5px;
  flex: none; position: relative;
}
#drawer .bx.on { background: var(--amber); border-color: var(--amber-deep); }
#drawer .bx.on::after {
  content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(42deg);
}
#drawer .pills { display: flex; gap: 5px; padding: 4px 16px 8px; flex-wrap: wrap; }
#drawer .pills button {
  font-size: 11.5px; padding: 2.5px 9px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-2);
}
#drawer .pills button.on {
  background: var(--amber); border-color: var(--amber-deep); color: #3a2408; font-weight: 600;
}
#drawer .none { padding: 9px 16px 12px; font-size: 12px; color: var(--ink-3); }

/* カレンダー。**いつからいつまでを、押して決める。** 日付を打たせない。 */
#drawer .calhead {
  display: flex; align-items: center; gap: 6px; padding: 4px 16px 6px;
  font-size: 12.5px; font-weight: 600;
}
#drawer .calhead .mv {
  padding: 1px 7px; border-radius: 6px; color: var(--ink-2); font-weight: 400;
}
#drawer .calhead .mv:hover { background: var(--hover); }
#drawer .calhead .now { margin-left: auto; font-size: 11.5px; font-weight: 400; color: var(--ink-3); }
#drawer .cal {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; padding: 0 12px 10px;
}
#drawer .cal .wd { text-align: center; font-size: 10.5px; color: var(--ink-3); padding: 2px 0 4px; }
#drawer .cal button {
  padding: 4px 0; font-size: 12px; color: var(--ink); border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
#drawer .cal button.out { color: var(--ink-3); opacity: .45; }
#drawer .cal button:hover { background: var(--hover); }
#drawer .cal button.in { background: var(--sel); border-radius: 0; }
#drawer .cal button.edge { background: var(--amber); color: #3a2408; font-weight: 700; border-radius: 6px; }
#drawer .cal button.today { outline: 1px solid var(--amber-deep); outline-offset: -1px; }
#drawer .span { display: flex; align-items: center; gap: 6px; padding: 4px 16px 10px; font-size: 12px; }
#drawer .span button {
  border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
#drawer .span button.on { border-color: var(--amber-deep); background: var(--sel); color: var(--ink); }
#drawer .span .x { color: var(--ink-3); padding: 2px 5px; border: none; }
/* 色の献立の丸。**名前の隣に、その色そのものを置く** ── 「ベルガモット」が
   どれかを覚えている人はいない。 */
#more .dot {
  width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid; flex: none;
}
/* 工房の色の選び口 ── 選んだ色で、選び口そのものを塗る。 */
/* **色の列も、ほかの列と同じ左揃え。** ここだけ真ん中に寄っていて、
   上下に並んだ選び口の字がそこだけ揃わなかった。 */
#studio .paint select { text-align: left; }
/* 段の見出しの ＋ */
.head { display: flex; align-items: center; }
.head .plus {
  margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 5px; color: var(--ink-3);
}
.head .plus svg { width: 13px; height: 13px; }
.head .plus:hover { background: var(--hover); color: var(--ink); }
/* クラウドの置き土産。**黙って足りない一覧を見せない** ── 落ちてきていない
   ノートも、同時に書いた控えも、amber の側では直せないが、言わないと
   「ノートが消えた」にしか見えない。 */
#cloudsay { flex: none; border-bottom: 1px solid var(--line-2); }
#cloudsay[hidden] { display: none !important; }
#cloudsay .c { padding: 8px 16px; font-size: 11.5px; line-height: 1.55; }
#cloudsay .c + .c { border-top: 1px solid var(--line-2); }
#cloudsay .c b { display: block; font-size: 12.5px; }
#cloudsay .c span { color: var(--ink-2); }
#cloudsay .wait { background: color-mix(in srgb, #3D7FA8 10%, var(--list)); }
#cloudsay .wait b { color: #2c6183; }
#cloudsay .clash { background: color-mix(in srgb, #D07A2E 12%, var(--list)); }
#cloudsay .clash b { color: var(--amber-deep); }
/* 共有中の札。**書く前に分かるように** ── 家族が読むノートに、そうと
   知らずに書くことがないように。 */
.row .sharemark {
  margin-left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px;
  border-radius: 999px; background: color-mix(in srgb, #3FA05C 20%, transparent);
  color: #2c7742; vertical-align: 1px;
}
/* 控えの札。**行から消さずに貼る** ── 消すと中身を助け出す道が無くなる。 */
.row .clashmark {
  margin-left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px;
  border-radius: 999px; background: color-mix(in srgb, #D07A2E 22%, transparent);
  color: var(--amber-deep); vertical-align: 1px;
}
#rows { flex: 1; overflow-y: auto; }
.row {
  padding: 10px 16px; border-bottom: 1px solid var(--line-2); cursor: pointer;
}
.row:hover { background: var(--hover); }
.row.on { background: var(--sel); }
/* **まとめて選んでいる行。** 升は出さない ── ふだんの一覧の形が変わると、
   選びはじめた瞬間に行がずれて、押そうとしていた行が逃げる。地色と、
   左の縁の一本だけ。開いている行（`.on`）とは別の色にする ── 同じ色だと
   「いま見ている一本」と「選んだ二十本」が同じ顔になる。 */
.row.pick { background: var(--pick); box-shadow: inset 3px 0 0 var(--pick-line); }
.row.pick:hover { background: var(--pick-hover); }
/* いま開いていて、かつ選ばれている行。縁は残す。 */
.row.on.pick { background: var(--pick); }
/* 選んでいる間の帯。**一覧の頭に出る** ── 何本選んでいるかと、やめる道。 */
#picked {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; background: var(--pick);
  border-bottom: 1px solid var(--pick-line);
  font-size: 12px;
}
#picked .n { font-weight: 700; }
#picked .sp { margin-left: auto; }
#picked button {
  border: 1px solid var(--pick-line); background: var(--paper);
  border-radius: 5px; padding: 1px 8px; font: inherit; font-size: 11.5px;
  color: var(--ink); cursor: pointer;
}
#picked button:hover { background: var(--hover); }
.row .t {
  font-weight: 600; font-size: 13.5px; line-height: 1.45;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .x {
  font-size: 12px; color: var(--ink-2); line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .m { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.row .d { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
.row .tags { display: flex; gap: 4px; overflow: hidden; min-width: 0; }
.row .tag {
  font-size: 10.5px; padding: 0 6px; border-radius: 999px;
  background: var(--line-2); color: var(--ink-2); white-space: nowrap;
}
.row .star { color: var(--amber); flex: none; }
/* いくつ済んだか。**数えるだけ** ── 進み具合は既にノートの中に書いてある。 */
.row .done {
  font-size: 10.5px; padding: 0 5px; border-radius: 999px; flex: none;
  background: var(--sel); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
#empty { padding: 34px 20px; color: var(--ink-3); font-size: 13px; text-align: center; }

/* ── 机（タブ） ── */
#strip {
  display: flex; gap: 4px; align-items: center; flex: none;
  padding: 5px 10px; background: var(--list);
  border-bottom: 1px solid var(--line);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
#strip::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 5px; flex: none;
  max-width: 16ch; padding: 3px 6px 3px 9px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); font-size: 12px; color: var(--ink-2);
  cursor: pointer; user-select: none;
}
.tab:hover { background: var(--hover); }
/* いま出しているタブ。**下の縁で言う** ── 地色だけだと、選んだノートの
   地色（琥珀）と見分けがつかない。 */
.tab.on {
  background: var(--paper); color: var(--ink); font-weight: 600;
  border-color: var(--amber); box-shadow: inset 0 -2px 0 var(--amber);
}
.tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* まだ書き込まれていない印。**閉じるかどうかを決める、まさにその場所で言う。** */
.tab .d { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: none; }
.tab .x {
  border: 0; background: none; padding: 0 2px; cursor: pointer;
  color: var(--ink-3); font-size: 11px; line-height: 1; flex: none;
}
.tab .x:hover { color: var(--ink); }
/* ノートだけを大きくしているときは、机も畳む。 */
body.zen #strip { display: none; }

/* ── 右: 中身 ── */
#pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--paper); }
/* **帯には、幅の要るものだけ置く。** 1180px（既定の窓）だと中の列が
   636px しかなく、面の札とボタンを並べただけで一杯になる ── 右端の字数と
   状態は縮んで消えていた（「保存しました」が見えるのに押したボタンが動く、
   の裏側はこれ）。目次（☰）と拡大（⤢）は名前の付いた命令として
   「ノート ▾」へ移した ── 名無しの記号二つより、名前のほうが見つかる。 */
#top {
  display: flex; align-items: center; gap: 7px;
  padding: 12px 14px; border-bottom: 1px solid var(--line-2);
  -webkit-app-region: drag;
}
body.mac #top { padding-top: 30px; }
/* **題は、一文字まで縮まない。** 帯には面の札も字数もタグも並ぶので、
   題だけが `min-width: 0` だと、そこが全部のしわ寄せを引き受けて
   「amber へようこそ」が「a」になる（実際になった）。題に床を敷き、
   縮むのは右端の meta のほうにする。 */
#title {
  font-size: 17px; font-weight: 700; flex: 1 1 auto; min-width: 9ch;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  /* 押せば直せる。**ふだんはボタンに見せない** ── 帯の題は読むものが先で、
     直すのはたまに。触れたときだけ、直せることが分かればいい。 */
  border: 1px solid transparent; border-radius: 5px;
  margin: -2px -6px; padding: 2px 6px;
}
#title:hover { border-color: var(--line); background: var(--paper); }
#title:focus {
  outline: none; white-space: pre; text-overflow: clip;
  border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft);
  background: var(--paper); cursor: text;
}
/* ノートを開いていないときは、帯に ⚙ だけが残る ── 右端に寄せる。 */
#title[hidden] ~ #gear { margin-left: auto; }
/* **字数と状態は、幅の決まった枠に住む。**
   前はどちらも中身の長さぶんの幅を取っていた ── 「保存しました」が出た
   瞬間に帯じゅうが左へずれ、いま押したボタンがカーソルの下から逃げる。
   取り消しを続けて二回押せないのはこれで、一覧の行が一度で開けなかった
   のと同じ「押した先が動く」不具合。**枠を先に取っておけば動かない。** */
#meta {
  /* **幅は中身で決まらない。** `0 1 132px` は「132px から、足りなければ
     縮む」── 縮むかどうかは窓の広さで決まり、中の字の長さでは決まらない。
     だから「保存しました」が出てもボタンは動かない。 */
  flex: 0 1 112px; min-width: 0; display: flex; flex-direction: column;
  align-items: flex-end; gap: 1px; -webkit-app-region: no-drag; overflow: hidden;
}
#count2, #state {
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#state {
  font-size: 11.5px; color: var(--ink-3);
}
/* いま何字か。**題の隣ではなく右端** ── 書いている間ずっと動く数字が
   題のとなりにあると、視線が題に戻るたびに数字を読んでしまう。 */
/* **⋯ と ⚙ の区別を、形ではなく言葉で付ける。**
   前は点三つと歯車が並んでいて、どちらがノートの話でどちらがアプリの話か
   画面のどこにも書いていなかった。片方に名前を付ける。 */
#dots, #gear {
  flex: none; padding: 3px 8px; border-radius: 8px;
  color: var(--ink-2); -webkit-app-region: no-drag; line-height: 1.3;
}
#dots { font-size: 12.5px; font-weight: 600; }
/* 歯車は絵なので、字と同じ大きさだと小さく見える。 */
#gear { font-size: 23px; padding: 0 8px; line-height: 1; }
#dots:hover, #gear:hover { background: var(--hover); color: var(--ink); }

/* 戻す・やり直す。**歯車の左** ── ノートに対してすることなので、
   amber に対してすること（歯車）より手前に置く。戻れないときは薄くする
   ── 消すと、押せるものの位置が押すたびに動く。 */
/* **小さすぎた。** 15px の線画を 27px の枠に置いていて、鐘か矢印かを
   見分けるのに目を寄せることになっていた。歯車と同じ背丈に揃える。 */
#back, #fwd, #bell {
  flex: none; width: 32px; height: 30px; border-radius: 8px;
  color: var(--ink-2); -webkit-app-region: no-drag;
  display: flex; align-items: center; justify-content: center;
}
#back[hidden], #fwd[hidden], #bell[hidden] { display: none !important; }
#back svg, #fwd svg, #bell svg { width: 19px; height: 19px; }
#bell:hover { background: var(--hover); color: var(--ink); }
/* 仕掛けてあるノートは、鐘が琥珀になる ── 開くたびに献立を開いて
   確かめなくていい。 */
#bell.on { color: var(--amber-deep); }
#back:hover:not(:disabled), #fwd:hover:not(:disabled) {
  background: var(--hover); color: var(--ink);
}
#back:disabled, #fwd:disabled { opacity: .3; }

/* 書く面の絵。**字は消さず、行の下に空きを作って置く** ── 消して絵に
   すると、パスを一文字直したいだけのときに直しようがない。 */
.zoneimg {
  display: flex; align-items: center; padding: 6px 0 6px 34px;
}
.zoneimg img {
  max-height: 112px; max-width: 60%; border-radius: 8px;
  border: 1px solid var(--line); background: var(--paper);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.zoneimg.bad {
  font-size: 12px; color: #C4564E; padding-left: 34px;
}

/* ── 読む面で書く ── */
/* **面ぜんぶが入力欄。** 置いて打てる ── 押して開く一手は挟まない。 */
#read { outline: none; caret-color: var(--amber-deep); cursor: text; }
#read:focus { outline: none; }
/* 触れないかたまりだけ、指を乗せると分かるようにする ── そこは押すと
   書く面へ行く（打てるのに保存されない、を作らないため）。 */
/* **注記と表は、ここから外した。** どちらも「表示」で直せるようになった
   のに、指の形と枠だけが「触れないもの」のまま残っていた ── 押すと書く面
   へ飛ぶ印が出ているところを、打てると思う人はいない（実際に「注記は表示
   モードで直せなかった」と言われた）。顔ぶれは `richBlock()` と揃える。 */
#read pre, #read figure, #read .mermaid { cursor: pointer; }
#read pre:hover, #read figure:hover, #read .mermaid:hover {
  outline: 2px solid color-mix(in srgb, var(--amber) 45%, transparent);
  outline-offset: 3px; border-radius: 8px;
}
#count2 {
  font-size: 11.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
#count2:empty { display: none; }
/* 書く・読む・並べる。**キーだけにしない** ── ⌘E を知らない人には
   無い機能と同じで、あることを画面が言わないと誰も押さない。 */
#views {
  display: flex; gap: 2px; flex: none; padding: 2px; border-radius: 8px;
  background: var(--rail); border: 1px solid var(--line-2);
  -webkit-app-region: no-drag;
}
#views button {
  padding: 3px 8px; border-radius: 6px; font-size: 11.5px; color: var(--ink-2);
  white-space: nowrap;
}
#views button:hover { background: var(--hover); }
#views button.on { background: var(--paper); color: var(--ink); font-weight: 700;
  box-shadow: 0 1px 2px rgba(0,0,0,.06); }
/* 書く面と読む面。**同じ場所に重ねず、横に並べる** ── 重ねると
   Monaco の `automaticLayout` が幅ゼロのまま測り、戻したとき行が折り返し
   直されるまで一瞬崩れる。 */
#work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#panes { flex: 1; min-height: 0; display: flex; }
#ed { flex: 1; min-width: 0; }
/* ── 読める形 ──

   直したのは三つ。

   1. **一行の長さ。** 前は面の幅いっぱいに流していた。窓を広げるほど一行が
      長くなり、行を折り返すたびに目が左端を探す ── 読みにくさの半分はこれ
      で、字体や色の話ではない。34em（およそ日本語 40〜45字）で止める。
   2. **見出しの上下。** 前は上下が同じだけ空いていたので、見出しがどちらの
      段落のものか決まらなかった。**上を厚く、下を薄く** ── 見出しは次の
      かたまりの持ち物。
   3. **絵。** 前は裸で置いていた。地と同じ白い絵を貼ると、どこからが絵なのか
      分からない。細い枠と丸みと薄い影を付け、`alt` があれば下に添える。 */
#read {
  flex: 1; min-width: 0; overflow-y: auto;
  padding: 26px 32px 64px; font-size: 14.5px; line-height: 1.9;
}
/* ── 入ってきたもの ──────────────────────────────────────
   同じノートを二人が書いたときは黙って混ぜる（依頼 336）。**混ぜたことは
   ノートに書かない**ので、来た行がどれかは画面が色で言う。

   **淡く敷く（案二）。** 柱ではなく地色にしたのは本人が選んだ形 ──
   目が勝手に行く。濃く敷くと字が沈むので、地は琥珀の淡いほう。 */
#band {
  display: flex; align-items: center; gap: 9px; flex: none;
  padding: 9px 15px; font-size: 12.5px; color: var(--ink);
  background: color-mix(in srgb, var(--amber) 12%, var(--paper));
  border-bottom: 1px solid var(--line-2);
}
#band[hidden] { display: none !important; }
#band .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-s); flex: none; }
#band.eyes .dot { background: #C4564E; }
#band .act {
  margin-left: auto; color: var(--brand-s); font-weight: 600;
  white-space: nowrap; cursor: pointer;
}
#band .act:hover { text-decoration: underline; }
/* 来た行。**地色だけ** ── 字も並びも動かさない。 */
#read .came { background: color-mix(in srgb, var(--amber) 12%, transparent); }
/* 同じ場所を二人が書いて、両方残したところ。**ここだけ強くする** ──
   人が読んで、要らないほうを消すしかない場所なので。 */
#read .both {
  background: color-mix(in srgb, var(--amber) 12%, transparent);
  box-shadow: inset 3px 0 0 #C4564E;
}

/* **柱は一本。左端で揃える。**
   `34em` は要素ごとの字の大きさで効くので、同じ「34em」でも
   見出し・本文・罫線が**全部ちがう幅**になっていた ── 実測で
   H1 が左から 32px、本文が 169px、罫線に至っては 300px で、
   230px の棒が真ん中に浮いていた。**左端がガタガタ**だった。

   `rem` なら画面の字（16px）で一度だけ決まるので、どのかたまりも
   同じ幅・同じ左端になる。そして**真ん中に寄せない** ── 「並べて」も
   「コード」も字は左から始まるので、面を替えるたびに柱が横へ跳ぶ。 */
#read > * { max-width: 34rem; margin-left: 0; margin-right: 0; }
#read > :first-child { margin-top: 0; }
body.split #read { border-left: 1px solid var(--line-2); }

#read h1, #read h2, #read h3, #read h4, #read h5, #read h6 {
  line-height: 1.45; margin: 1.9em 0 .55em; font-weight: 700;
  letter-spacing: .002em;
}
#read h1 { font-size: 1.72em; letter-spacing: -.012em; margin-top: 0; }
#read h2 {
  font-size: 1.32em; letter-spacing: -.008em;
  padding-bottom: .3em; border-bottom: 1px solid var(--line-2);
}
#read h3 { font-size: 1.13em; }
#read h4, #read h5, #read h6 { font-size: 1em; color: var(--ink-2); }
#read p { margin: .8em 0; }
#read ul, #read ol { margin: .7em 0; padding-left: 1.5em; max-width: 34rem; }
#read li { margin: .2em 0; }
#read li::marker { color: var(--ink-3); }
#read li > ul, #read li > ol { margin: .2em 0; max-width: none; }

/* チェックは押せる。**押せると分かる形にする** ── 読める形の中で
   ただ一つ触れるものなので、触れないものと同じ見た目では見つからない。 */
#read li.task { list-style: none; margin-left: -1.3em; }
#read .box {
  display: inline-block; width: 1.3em; cursor: pointer;
  color: var(--amber-deep); font-size: 1.05em; user-select: none;
  font-family: inherit; line-height: inherit; text-align: left;
}
#read .box:hover { color: var(--amber); }
#read .box:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; border-radius: 4px; }

#read blockquote {
  margin: 1em 0; padding: .2em 0 .2em 1.1em;
  border-left: 3px solid var(--line); color: var(--ink-2);
}
#read blockquote > :first-child { margin-top: 0; }
#read blockquote > :last-child { margin-bottom: 0; }

#read code {
  font: .87em/1.7 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  background: var(--rail); border: 1px solid var(--line-2);
  border-radius: 5px; padding: .12em .38em;
}
#read pre {
  margin: 1.1em 0; padding: 13px 16px; overflow-x: auto;
  background: var(--rail); border: 1px solid var(--line-2); border-radius: 10px;
}
#read pre code { background: none; border: 0; padding: 0; font-size: .86em; }
/* **枠の中に、琥珀の字**（依頼 437）。` ```amber ` と書いた枠だけ、この色で
   出す ── 初めて開いた人に見せる絵のため。Monaco はこの語彙を知らないので
   色を付けず、書いた字がそのまま残る。**メモ帳でも GitHub でも、ただの枠と
   して読める**（色は amber で開いた人のぶん）── ノートに入るのは囲みの中の
   字だけで、覚える記法は増えない。 */
#read pre > code.language-amber {
  color: var(--amber);
  /* **行間をゼロに。** 絵は半分の高さの記号（▀▄█）で描いてあるので、
     行が離れていると縦の棒が繋がらず、字が横縞に割れて読めない
     （実際にそう出た）。ここだけ詰める。 */
  display: block; line-height: 1; letter-spacing: 0;
}

/* 区切り線は端まで引かない ── 全幅の線は「ここで終わり」に見えるが、
   Markdown の `---` は「話が変わる」でしかない。 */
#read hr {
  margin: 2.2em 0; border: 0; height: 1px; width: 30%;
  background: var(--line);
}

#read a {
  color: var(--amber-deep); text-decoration: underline;
  text-decoration-color: var(--line); text-underline-offset: .18em;
  text-decoration-thickness: 1px;
}
#read a:hover { text-decoration-color: currentColor; }

/* ── 絵 ──
   裸で置かない。**地と同じ色の絵は、どこからが絵か分からない。** */
#read figure { margin: 1.4em 0; text-align: center; }
#read img {
  max-width: 100%; height: auto; border-radius: 10px;
  border: 1px solid var(--line); background: var(--paper);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .07), 0 6px 18px rgba(0, 0, 0, .05);
}
#read figcaption {
  margin-top: .55em; font-size: 12px; color: var(--ink-3); line-height: 1.6;
}

#read table {
  border-collapse: collapse; margin: 1.1em 0; display: block;
  overflow-x: auto; max-width: 34rem; font-size: .95em;
}
#read th, #read td { border: 1px solid var(--line-2); padding: 6px 12px; }
#read th { background: var(--rail); font-weight: 700; text-align: left; }
#read tbody tr:nth-child(even) { background: color-mix(in srgb, var(--rail) 45%, transparent); }
#read del { color: var(--ink-3); }

/* **図は、文の幅に従わない。** 34em は目が一行を追える長さの話で（`#read`
   の頭に書いた理由）、図はそもそも行ではない。狭い枠に押し込むと
   `useMaxWidth` が全体を縮め、年表の札の字が 14px から 8px になって
   読めなくなった ── 図は図の幅で描かせ、はみ出すぶんだけ横に流す。 */
#read .mermaid {
  margin: 1.4em 0; overflow-x: auto; text-align: center;
  max-width: min(100%, 52em);
}
#read .mermaid svg { max-width: 100%; height: auto; }
/* 描けなかった図は、書いた字のまま残す ── 消すと直しようがない。 */
#read pre.bad { border-color: #C4564E; }

/* GitHub 風の注記。**色だけで区別しない** ── 見出しの語を必ず出す。
   色が見えない人にも、白黒で刷ったときにも、種類が残る。 */
#read .alert {
  margin: 1.2em 0; padding: .1em 1.1em .1em 1em;
  border-left: 4px solid var(--ink-3);
  background: var(--rail); border-radius: 0 9px 9px 0;
}
#read .alert-h {
  margin: .7em 0 .25em; font-weight: 700; font-size: .9em; letter-spacing: .05em;
  color: var(--ink-2);
}
#read .alert > :last-child { margin-bottom: .7em; }
#read .alert.note { border-left-color: #3D7FA8; }
#read .alert.tip { border-left-color: #5E8C42; }
#read .alert.important { border-left-color: #9A6FB5; }
#read .alert.warning { border-left-color: #D07A2E; }
#read .alert.caution { border-left-color: #C4564E; }
#read .alert.note .alert-h { color: #3D7FA8; }
#read .alert.tip .alert-h { color: #5E8C42; }
#read .alert.important .alert-h { color: #9A6FB5; }
#read .alert.warning .alert-h { color: #D07A2E; }
#read .alert.caution .alert-h { color: #C4564E; }

/* 最大化（Inkdrop の distraction free）。**畳むのは左の二列だけ** ──
   上の帯を消すと、いま何を開いているのか分からない画面になる。 */
body.zen #rail, body.zen #list { display: none; }
/* 左の列だけ畳む（⌘/）。一覧は残す ── 行き先と一覧は別の問いで、
   狭いときに先に要らなくなるのは「どこにいるか」のほう。 */
body.norail #rail { display: none; }
body.nolist #list { display: none; }
/* **狭めるのは字であって、巻物ではない。**
   `#read` は自分で縦に巻く箱なので、箱ごと 760px に狭めて真ん中に置くと
   **巻物の摘みも真ん中に来る** ── 広い窓では画面のまんなかに棒が浮いて
   見えた。読む面の字はもともと `#read > *` が 34em に収めているので、
   箱を狭める意味は初めから無かった（狭めていたのは棒の居場所だけ）。
   書く面（Monaco）は行が箱の端まで伸びて折り返すので、あちらは箱ごと
   狭めるのが行の長さそのもの ── こちらは残す。 */
body.zen #ed { max-width: 760px; margin: 0 auto; width: 100%; }

/* vim の状態行。`-- INSERT --` と `:` の入力欄がここに出る。
   **道具の帯より下、画面のいちばん下** ── vim を使う人が目を落とす場所。 */
#vim {
  flex: none; display: none; padding: 3px 12px;
  border-top: 1px solid var(--line-2); background: var(--rail);
  font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ink-2); white-space: pre;
}
body.vim #vim { display: block; }
#vim input {
  font: inherit; color: var(--ink); background: none; border: 0;
  outline: none; width: 60%;
}

/* ── 書く道具。**キーボードの手前に置く** ── iPhone と同じ並び順 ── */
#marks {
  flex: none; border-top: 1px solid var(--line-2); background: var(--rail);
  -webkit-app-region: no-drag;
}
#marks .r { display: flex; gap: 4px; padding: 5px 8px; align-items: center; }
/* 流れるのは記号だけ ── 「ほかの記号」のボタンは端に残す。 */
#marks .rs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
#marks .r + .r { border-top: 1px solid var(--line-2); }
#marks button {
  flex: none; display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 7px; font-size: 12.5px;
  color: var(--ink-2); white-space: nowrap; border: 1px solid transparent;
}
/* **名前だけ。絵は置かない**（2026-09-08）── 一度は絵だけにしたが、
   「ビギナーには何がなんだか分からない」で戻した。分かることを、訳の
   都合で捨てない。外へ配る日は、字をその国の言葉に置き換えればいい。 */
#marks button:hover { background: var(--hover); border-color: var(--line-2); }
#marks button:active { background: var(--sel); }
#marks button.on { background: var(--sel); color: var(--ink); }
#marks .sep { flex: none; width: 1px; background: var(--line); margin: 3px 3px; }
/* **読む面でも道具の帯は出す。** 記号を覚えていない人の道具なので、
   記号の見えない面でこそ要る。 */


#blank {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; color: var(--ink-3);
}
#blank img { width: 54px; height: 54px; opacity: .5; }

/* ── 小窓 ── 命令を選ぶ・字を打つ・一つ選ぶ、を一つで賄う ──
   別々に作ると、三つの微妙に違う「Esc で閉じる」ができる。 */
#veil {
  position: fixed; inset: 0; z-index: 30; display: flex;
  justify-content: center; align-items: flex-start; padding-top: 12vh;
  background: rgba(0,0,0,.28);
  /* 小窓は帯より下に出るので今は当たっていないが、上げた日に黙って
     押せなくなる ── 切っておく（理由は `#studio` に書いた）。 */
  -webkit-app-region: no-drag;
}
#veil[hidden] { display: none !important; }
#sheet {
  width: min(560px, 88vw); max-height: 70vh; display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line); border-radius: 13px;
  box-shadow: 0 18px 48px rgba(0,0,0,.3); overflow: hidden;
}
/* **名前を名前として見せる、ただ一つの場所。**
   ここだけは題でも行でもなく「名札」なので、綴りに琥珀を一点差せる
   ── ホーム画面の名札も窓の題名も OS が描くので色を持てず、
   README は GitHub が色を落とす。 */
#sheet .brand { padding: 16px 15px 13px; }
#sheet .brand .nm { font-size: 27px; font-weight: 600; color: var(--ink); line-height: 1.2; }
#sheet .brand .ex { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
/* **明るい地では濃い琥珀、暗い地では明るい琥珀。**
   `--amber`（#f0a52b）は明るい黄橙なので、明るい紙の上では一文字だけだと
   薄れて沈む ── 地の明暗で入れ替える（`--amber-deep` は既にその色）。 */
#sheet .brand .s { color: var(--brand-s); }
#sheet .hd { padding: 11px 15px 0; font-size: 12px; color: var(--ink-3); }
/* 名札が題を兼ねる小窓では、題は空になる ── 空のまま置くと余白だけが残る。 */
#sheet .hd:empty { display: none; }
#sheet input {
  margin: 7px 12px 10px; padding: 8px 11px; border-radius: 9px; font: inherit;
  font-size: 14.5px; background: var(--bg); border: 1px solid var(--line);
  color: var(--ink); outline: none;
}
#sheet input:focus { border-color: var(--amber); }
/* はい／いいえのときは、欄を見せない（鍵盤は受け続ける）。 */
#sheet.bare input {
  height: 0; margin: 0; padding: 0; border: 0; opacity: 0; pointer-events: none;
}
#sheet.bare .hd { padding: 14px 15px 10px; font-size: 14px; color: var(--ink); }
#sheet.bare .items { border-top: 1px solid var(--line-2); }
#sheet .items { overflow-y: auto; border-top: 1px solid var(--line-2); }
#sheet .items:empty { display: none; }
#sheet .it {
  padding: 8px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  font-size: 13.5px;
}
#sheet .it .k { margin-left: auto; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
#sheet .it .sub { font-size: 11.5px; color: var(--ink-3); }
/* 描ききれなかったぶんの一行。**押せない** ── 行き先ではなく、断り書き。 */
#sheet .more { padding: 7px 12px; font-size: 11.5px; color: var(--ink-3); }
/* 束の見出し。押せないので、行としての床（背景・当たり）を持たない。 */
#sheet .gp { display: flex; gap: .6em; padding: 11px 12px 3px;
  font-size: 11.5px; color: var(--ink-3); }
#sheet .gp .sub { color: var(--ink-3); opacity: .75; }
#sheet .it.on { background: var(--sel); }
/* **改行をそのまま出す。** `textContent` に入れた `\n` は既定では
   ただの空白に潰れる ── 二行のつもりで書いた添え書きが一本の長い行に
   なり、書いたほうは画面を見るまで気づかない。 */
#sheet .foot { padding: 8px 15px; font-size: 11.5px; color: var(--ink-3);
  border-top: 1px solid var(--line-2); white-space: pre-line; }

/* ── 図の工房 ── 左に表、右に図。**直したそばから見える** ──
   見えないまま字を直させるのが、mermaid をいちばん難しくしていた。 */
#studio {
  position: fixed; inset: 0; z-index: 32; display: flex;
  align-items: center; justify-content: center; padding: 4vh 4vw;
  background: rgba(0,0,0,.34);
  /* **窓を掴む場所を、ここでは切る。** `#top` は窓ごと引きずるための帯
     （`-webkit-app-region: drag`）で、上に重ねたものより先に押しを取る ──
     重ね順は効かない。工房は上から 4vh に出るので帯とちょうど重なり、
     切らないと「この形にする」も「やめる」も押せない（実際に押せなかった）。 */
  -webkit-app-region: no-drag;
}
#studio[hidden] { display: none !important; }
#studiobox {
  width: min(1080px, 100%); height: 100%; display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 22px 60px rgba(0,0,0,.34); overflow: hidden;
}
#studiobox > .hd {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--line-2); background: var(--rail);
}
#studiobox .what { font-size: 13.5px; font-weight: 700; color: var(--ink); }
#studiobox .kind {
  font-size: 11.5px; color: var(--ink-2); padding: 2px 9px; border-radius: 999px;
  background: var(--sel); border: 1px solid var(--line-2);
}
#studiobox .grow { flex: 1; }
#studiobox .hd button {
  padding: 5px 13px; border-radius: 8px; font-size: 12.5px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
}
#studiobox .hd button:hover:not(:disabled) { background: var(--hover); }
#studiobox .hd button:disabled { opacity: .45; }
#studiook {
  background: linear-gradient(180deg, color-mix(in srgb, var(--amber) 88%, white), var(--amber)) !important;
  border-color: color-mix(in srgb, var(--amber) 70%, black) !important;
  color: #3a2408 !important; font-weight: 700;
}
#studiook:active { transform: translateY(1px); }
#studiobox > .body { flex: 1; display: flex; min-height: 0; }
#studiobox .form {
  flex: 0 0 46%; min-width: 0; overflow-y: auto; padding: 14px;
  border-right: 1px solid var(--line-2); background: var(--bg);
}
#studiobox .grp { margin-bottom: 15px; }
#studiobox .grp > label {
  display: block; margin-bottom: 5px; font-size: 11.5px; font-weight: 700;
  color: var(--ink-3); letter-spacing: .04em;
}
#studiobox .grp > input, #studiobox .grp > select {
  width: 100%; padding: 7px 10px; border-radius: 8px; font: inherit; font-size: 13.5px;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink); outline: none;
}
#studiobox .grp.bare { margin: 0; }
#studiobox .grp.bare > select { padding: 6px 7px; font-size: 12.5px; }
#studiobox input:focus, #studiobox select:focus, #studiobox textarea:focus {
  border-color: var(--amber); box-shadow: 0 0 0 2px color-mix(in srgb, var(--amber) 26%, transparent);
}
#studiobox .rows {
  border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--paper);
}
#studiobox .row {
  display: flex; align-items: center; gap: 6px; padding: 5px 7px;
  border-top: 1px solid var(--line-2);
}
#studiobox .row:first-child { border-top: 0; }
#studiobox .row.hd {
  background: var(--rail); font-size: 11px; color: var(--ink-3);
  font-weight: 700; letter-spacing: .04em; padding: 4px 7px;
}
#studiobox .row.hd .sp { flex: 0 0 84px; }
#studiobox .row.hd .sp.wide { flex: 0 0 140px; }
/* 深さは、字下げそのもので見せる ── 「2」と書くより、ずれている形の
   ほうが枝に見える。 */
#studiobox .row .deep {
  color: var(--ink-3); font-size: 11px; text-align: right;
  padding-right: 3px; white-space: nowrap; overflow: hidden;
}
#studiobox .mini:disabled { opacity: .28; }
#studiobox .mini:disabled:hover { background: none; color: var(--ink-3); }
#studiobox .row > input, #studiobox .row select {
  min-width: 0; padding: 5px 8px; border-radius: 7px; font: inherit; font-size: 13px;
  background: var(--bg); border: 1px solid var(--line-2); color: var(--ink); outline: none;
}
/* 日付の欄は、狭めると「2026/(」で切れて何日か読めなくなる ── 縮めない。 */
#studiobox .row > input[type="date"] { flex: 0 0 132px !important; }
#studiobox .row .slide { display: flex; align-items: center; gap: 5px; min-width: 0; }
#studiobox .row .slide input { flex: 1; min-width: 0; accent-color: var(--amber); }
#studiobox .row .slide .n {
  flex: none; width: 27px; font-size: 11px; color: var(--ink-3);
  font-variant-numeric: tabular-nums; text-align: right;
}
#studiobox .row .chk {
  display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3);
  white-space: nowrap;
}
#studiobox .row .chk input { accent-color: var(--amber); }
#studiobox .mini {
  flex: none; width: 24px; height: 24px; border-radius: 6px; font-size: 12px;
  color: var(--ink-3); line-height: 1;
}
#studiobox .mini:hover { background: var(--hover); color: var(--ink); }
#studiobox .add {
  margin-top: 7px; padding: 5px 12px; border-radius: 8px; font-size: 12.5px;
  color: var(--ink-2); background: var(--paper); border: 1px dashed var(--line);
}
#studiobox .add:hover { background: var(--hover); color: var(--ink); border-style: solid; }
#studiobox textarea {
  width: 100%; height: 46vh; padding: 9px 11px; border-radius: 9px; resize: vertical;
  font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink); outline: none;
}
#studiobox .note {
  margin-top: 8px; padding: 8px 11px; border-radius: 8px; font-size: 12px;
  line-height: 1.6; color: var(--ink-2); background: var(--sel);
  border-left: 3px solid var(--amber);
}
#studiobox .see { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#studiobox .view {
  flex: 1; min-height: 0; overflow: auto; display: flex;
  align-items: center; justify-content: center; padding: 18px;
}
#studiobox .view svg { max-width: 100%; height: auto; }
#studiobox .err {
  flex: none; padding: 8px 14px; font-size: 12px; line-height: 1.55;
  color: var(--ink-2); background: var(--sel); border-top: 1px solid var(--line-2);
}
#studiobox .err[hidden] { display: none !important; }

/* ── ⋯ の献立 ── */
#more {
  position: fixed; z-index: 25; min-width: 200px; padding: 5px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 11px;
  box-shadow: 0 12px 32px rgba(0,0,0,.24);
}
#more[hidden] { display: none !important; }

/* 絵文字の板。**押して入れるだけ** ── 記法も名前も覚えないで済むように。 */
#emoji {
  position: fixed; z-index: 26; width: 274px; padding: 8px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,.24);
}
#emoji[hidden] { display: none !important; }
#emojifind {
  width: 100%; padding: 5px 9px; font: inherit; font-size: 12.5px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; outline: none;
}
#emojifind:focus { border-color: var(--amber); }
#emojitabs { display: flex; gap: 2px; margin: 7px 0 5px; }
#emojitabs button {
  flex: 1; padding: 3px 0; border-radius: 6px; font-size: 15px; line-height: 1.3;
  opacity: .55;
}
#emojitabs button:hover { background: var(--hover); opacity: 1; }
#emojitabs button.on { background: var(--sel); opacity: 1; }
#emojigrid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
  max-height: 208px; overflow-y: auto;
}
#emojigrid button {
  padding: 4px 0; border-radius: 6px; font-size: 19px; line-height: 1.25;
}
#emojigrid button:hover { background: var(--sel); }
/* 見つからないときの一行。**盤の幅いっぱいに置く** ── 升の一つに
   見えると、押せるものだと思われる。 */
#emojigrid .none { grid-column: 1 / -1; padding: 14px 4px; text-align: center;
  font-size: 12px; color: var(--ink-3); }
#emojiname {
  margin-top: 6px; min-height: 1.4em; text-align: center;
  font-size: 11.5px; color: var(--ink-3);
}
#more button {
  display: flex; width: 100%; align-items: center; gap: 10px;
  padding: 6px 10px; border-radius: 7px; font-size: 13.5px; text-align: left;
}
#more button:hover { background: var(--hover); }
#more button .k { margin-left: auto; font-size: 11px; color: var(--ink-3); }
/* いまどうなっているかは**右端に揃える** ── 名前のすぐ後ろに置くと、
   命令ごとに違う位置で始まって、目が毎回探しに行く。 */
#more button .sub { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
#more .sep { height: 1px; background: var(--line-2); margin: 4px 6px; }

/* 表の道具。**縦棒を数えさせない** ── 打ち込む表は縦棒を数え続ける表で、
   揃え方の行（`:---` `---:`）の形は誰も覚えていない。 */
#tablebar {
  position: fixed; z-index: 22; display: flex; align-items: center; gap: 2px;
  padding: 3px 5px; border-radius: 9px;
  background: var(--paper); border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(0,0,0,.18);
}
#tablebar[hidden] { display: none !important; }
#tablebar button {
  padding: 2px 8px; border-radius: 6px; font-size: 12px; color: var(--ink-2);
  white-space: nowrap;
}
#tablebar button:hover { background: var(--hover); color: var(--ink); }
#tablebar .sep { width: 1px; height: 15px; background: var(--line-2); margin: 0 3px; }

/* 外から来た一本。**異例な開き方だと、画面が言う** ── 言わないと、
   いつもの一本と見分けが付かないまま別のフォルダへ書く。 */
#guestbar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 7px 18px; font-size: 12px;
  background: var(--sel); color: var(--ink-2);
  border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}
body.mac.guest #guestbar { padding-top: 30px; }
#guestbar[hidden] { display: none !important; }
#guestbar .what { font-weight: 700; color: var(--ink); flex: none; }
/* **末尾から削らない。** 道は後ろのほうが効くので、`direction: rtl` で
   逃げると `/` の位置まで入れ替わって別の道に見える（一度そうなった）。
   長い道は真ん中を落として渡す（`shortPath`）。 */
#guestwhere {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
#guestclose {
  flex: none; padding: 2px 10px; border-radius: 7px; font-size: 12px;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  -webkit-app-region: no-drag;
}
#guestclose:hover { background: var(--amber); color: #3a2408; }
/* 単発のときは、左の二列を出さない ── 索引の外にあるものなので。 */
body.guest #rail, body.guest #list { display: none; }
body.guest #top { padding-top: 12px; }

/* 落としている間、受け取ると分かるように。 */
body.dropping::after {
  content: ''; position: fixed; inset: 8px; z-index: 40; pointer-events: none;
  border: 3px dashed var(--amber); border-radius: 14px;
  background: color-mix(in srgb, var(--amber) 8%, transparent);
}

/* ── 目次 ── */
#toc {
  width: 210px; flex: none; overflow-y: auto; padding: 16px 10px 40px;
  border-left: 1px solid var(--line-2); background: var(--rail);
}
#toc[hidden] { display: none !important; }
#toc .h {
  display: block; width: 100%; text-align: left; padding: 3px 8px;
  border-radius: 6px; font-size: 12.5px; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#toc .h:hover { background: var(--hover); color: var(--ink); }
#toc .h[data-l="2"] { padding-left: 18px; }
#toc .h[data-l="3"] { padding-left: 28px; font-size: 12px; }
#toc .h[data-l="4"], #toc .h[data-l="5"], #toc .h[data-l="6"] { padding-left: 38px; font-size: 12px; }
#toc .none { padding: 6px 8px; font-size: 12px; color: var(--ink-3); }

/* ── 一覧の上のブックマーク ── */
.sect {
  font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3);
  padding: 9px 16px 3px; text-transform: uppercase;
  background: var(--list); border-bottom: 1px solid var(--line-2);
}

#say {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 7px 15px;
  border-radius: 999px; font-size: 12.5px; opacity: 0;
  transition: opacity .18s; pointer-events: none; z-index: 20;
}
#say.on { opacity: .94; }

/* ── ノートから使われていない画像 ──
   **小さく並べて、目で見て決める。** 名前だけの一覧では、消していいか
   どうかを誰も判断できない（消すのは戻せる形とはいえ、判断が要る）。 */
#spare { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; }
#sparebox { width: min(56rem, 92vw); max-height: 86vh; display: flex;
  flex-direction: column; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#sparebox .hd { display: flex; align-items: center; gap: .6rem;
  padding: .7rem .9rem; border-bottom: 1px solid var(--line); }
#sparebox .grow { flex: 1; }
#sparebox .sum { color: var(--ink2); font-size: .85em; }
#sparebox .warn { padding: .6rem .9rem; color: var(--ink);
  background: var(--sel); font-size: .85em; }
#sparebox .grid { overflow-y: auto; padding: .8rem;
  display: grid; gap: .7rem;
  grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); }
#sparebox .cell { border: 1px solid var(--line); border-radius: 9px;
  overflow: hidden; cursor: pointer; background: var(--rail); }
#sparebox .cell.on { border-color: var(--amber); }
#sparebox .cell .shot { height: 6.5rem; display: flex; align-items: center;
  justify-content: center; background: var(--bg); }
#sparebox .cell img { max-width: 100%; max-height: 6.5rem; display: block; }
#sparebox .cell .cap { padding: .4rem .5rem; font-size: .78em;
  color: var(--ink2); line-height: 1.4; word-break: break-all; }
#sparebox .cell .cap b { color: var(--ink); font-weight: 600; }
#sparebox .none { padding: 2rem; text-align: center; color: var(--ink2); }
/* ボタンは工房と同じ形 ── 同じ見た目のものは、同じ意味であってほしい。 */
#sparebox .hd button {
  padding: 5px 13px; border-radius: 8px; font-size: 12.5px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
}
#sparebox .hd button:hover:not(:disabled) { background: var(--hover); }
#sparebox .hd button:disabled { opacity: .45; cursor: default; }
#sparebox .hd .go:not(:disabled) {
  background: linear-gradient(180deg, color-mix(in srgb, var(--amber) 88%, white), var(--amber));
  border-color: color-mix(in srgb, var(--amber) 70%, black);
  color: #3a2408; font-weight: 700;
}

/* ── カレンダー（依頼 453）──
   月の表と、その日の中身。**ノートを組んだまま出せるのが、この道具で
   カレンダーを持つ意味** ── 予定表とノートが別のアプリなら作れない。 */
#cal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; }
#calbox { width: min(66rem, 94vw); height: min(44rem, 88vh); display: flex;
  flex-direction: column; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#calbox .hd { display: flex; align-items: center; gap: .5rem;
  padding: .6rem .9rem; border-bottom: 1px solid var(--line); }
#calbox .hd .mo { font-size: 1.05rem; min-width: 7.5rem; }
#calbox .hd .grow { flex: 1; }
#calbox .hd .sum { color: var(--ink2); font-size: .82em; }
#calbox .hd button { padding: 4px 11px; border-radius: 8px; font-size: 12.5px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
#calbox .hd button:hover { background: var(--hover); }
#calbox .body { flex: 1; display: grid; grid-template-columns: 1fr 17rem; min-height: 0; }
#calbox .month { padding: .6rem .7rem; display: flex; flex-direction: column; min-height: 0; }
#calbox .dow { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
#calbox .dow i { font-style: normal; text-align: center; font-size: .72em;
  color: var(--ink3); padding-bottom: 3px; }
#calbox .dow i.sat { color: #6f9fd8 } #calbox .dow i.sun { color: var(--bad) }
#calbox .days { flex: 1; display: grid; grid-template-columns: repeat(7,1fr);
  grid-auto-rows: 1fr; gap: 3px; min-height: 0; }
#calbox .d { background: var(--rail); border: 1px solid transparent;
  border-radius: 6px; padding: 2px 3px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; min-height: 0; }
#calbox .d:hover { border-color: var(--line) }
#calbox .d.dim { opacity: .45 }
#calbox .d.on { border-color: var(--line); background: var(--hover) }
#calbox .d.today { border-color: var(--amber) }
#calbox .d .n { font-size: .72em; color: var(--ink2); font-variant-numeric: tabular-nums }
#calbox .d.today .n { color: var(--amber); font-weight: 700 }
#calbox .d .ev { font-size: .68em; line-height: 1.5; margin-top: 1px; padding: 0 3px;
  border-left: 2px solid var(--amber); border-radius: 2px; background: var(--sel);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#calbox .d .ev.note { background: none; border-left-color: transparent; color: var(--ink3) }
#calbox .d .more { font-size: .66em; color: var(--ink3); padding-left: 3px }
#calbox .side { border-left: 1px solid var(--line); padding: .7rem .8rem;
  overflow-y: auto; background: var(--rail); }
#calbox .side .h { font-weight: 700; margin-bottom: .4rem }
#calbox .side .h small { color: var(--ink3); font-weight: 400; margin-left: .4em }
#calbox .side .slot { display: flex; gap: .5rem; padding: 3px 0; cursor: pointer;
  border-radius: 5px; font-size: .84em; }
#calbox .side .slot:hover { background: var(--hover) }
#calbox .side .slot .t { color: var(--ink3); min-width: 3rem;
  font-variant-numeric: tabular-nums; }
#calbox .side .slot .w b { display: block; font-weight: 600 }
#calbox .side .slot .w span { color: var(--ink3); font-size: .9em }
#calbox .side .none { color: var(--ink3); font-size: .84em; padding: .3rem 0 }
#calbox .side .add { margin-top: .7rem; width: 100%; padding: 5px;
  border: 1px dashed var(--line); border-radius: 8px; color: var(--ink2);
  font-size: .84em; background: none; }
#calbox .side .add:hover { border-color: var(--amber); color: var(--amber) }
</style>
</head>
<body>
  <div id="rail"></div>
  <div id="list">
    <div id="listhead">
      <div id="where">すべてのノート</div>
      <div id="count"></div>
      <div id="tools">
        <button id="findbtn" title="言葉で探す（⌘F）"></button>
        <button id="order" title="並び順を変える"></button>
      </div>
      <div id="findbox" hidden>
        <input id="find" type="text" placeholder="ノートを探す" spellcheck="false">
        <button id="findoff" title="やめる（Esc）">✕</button>
      </div>
      <div id="drawers"></div>
    </div>
    <div id="drawer" hidden></div>
    <div id="cloudsay" hidden></div>
    <!-- **選んでいる間だけ出る帯。** 何本選んでいるかと、まとめてすること
         と、やめる道。一覧の頭（`#rows` の外）に置く ── 中に入れると
         一覧をたどるたびに流れて消える。 -->
    <div id="picked" hidden></div>
    <div id="rows"></div>
  </div>
  <div id="pane">
    <div id="guestbar" hidden>
      <span class="what">ambər の外にあるノートを、単発で開いています</span>
      <span id="guestwhere"></span>
      <button id="guestclose">閉じて一覧に戻る</button>
    </div>
    <div id="top" hidden>
      <div id="title"></div>
      <div id="views">
        <button data-view="read" title="表示（⌘E で入れ替え）">表示</button>
        <button data-view="split" title="並べて表示（⌘P）">並べて表示</button>
        <button data-view="write" title="コード ── Markdown そのもの（⌘E）">コード</button>
      </div>
      <!-- **目次はボタンで出す。** 一度、帯の幅を空けるために献立へ引っ込めた
           ことがある（依頼 297）── 献立の中では見つからず、「消えた」と
           言われた。幅は `#meta` を固定してから空いている。 -->
      <button id="tocbtn" title="目次（⌘⇧O）">☰</button>
      <button id="dots" title="このノートにすること（右押しでも同じ）">ノート ▾</button>
      <button id="bell" title="通知設定 ── いつ知らせるか" hidden></button>
      <button id="back" title="一つ戻す（⌘Z）" hidden></button>
      <button id="fwd" title="やり直す（⌘⇧Z）" hidden></button>
      <button id="gear" title="ambər の設定と見た目（⌘⇧P で全部）">⚙</button>
      <div id="meta">
        <div id="count2"></div>
        <div id="state"></div>
      </div>
    </div>
    <div id="blank">
      <div id="blankmark"></div>
      <div>左からノートを選ぶか、<b>新しいノート</b>で書きはじめてください</div>
    </div>
    <!-- **机（タブ）。** 題の帯の下、ノートの上 ── 電話と同じ並び。
         一本しか開いていないときは出ない（ふだんの画面を、タブのために
         一段ぶん狭くしない）。 -->
    <div id="strip" hidden></div>
    <div id="work" hidden>
      <!-- **入ってきたものの報せ。** 面の上に置く ── 「並べて」でも
           「コード」でも同じことが起きているので、片方の面の中に入れると
           面を替えたときに消えたように見える。 -->
      <div id="band" hidden></div>
      <div id="panes">
        <div id="ed"></div>
        <div id="read" hidden></div>
        <div id="toc" hidden></div>
      </div>
      <div id="marks"></div>
      <div id="vim"></div>
    </div>
  </div>
  <div id="veil" hidden><div id="sheet">
    <div class="brand" hidden></div>
    <div class="hd"></div>
    <input type="text" spellcheck="false">
    <div class="items"></div>
    <div class="foot"></div>
  </div></div>
  <div id="more" hidden></div>
  <!-- 絵文字の板（依頼 418）。**探す欄・束の帯・盤**の三段。 -->
  <div id="emoji" hidden>
    <input id="emojifind" type="text" placeholder="絵文字を探す（おめでとう、など）" autocomplete="off">
    <div id="emojitabs"></div>
    <div id="emojigrid"></div>
    <div id="emojiname"></div>
  </div>
  <!-- **ノートから使われていない画像**（依頼 449）。小さく見せて、選んで
       ゴミ箱へ。数えるのは core、消すのは OS のゴミ箱 ── 見誤って消した
       ときに取り返しがつかないのが、いちばん悪い。 -->
  <div id="spare" hidden><div id="sparebox">
    <div class="hd">
      <b>ノートから使われていない画像</b>
      <span class="sum"></span>
      <span class="grow"></span>
      <button class="all">ぜんぶ選ぶ</button>
      <button class="go">ゴミ箱へ入れる</button>
      <button class="x">閉じる</button>
    </div>
    <div class="warn" hidden></div>
    <div class="grid"></div>
  </div></div>
  <!-- **カレンダー**（依頼 453）。ひと月ぶんを一度で取り、日を押すと
       右にその日が開く。よそのカレンダーは、あとでここに足す。 -->
  <div id="cal" hidden><div id="calbox">
    <div class="hd">
      <button class="prev" title="前の月">‹</button>
      <b class="mo"></b>
      <button class="next" title="次の月">›</button>
      <button class="today">今日</button>
      <span class="grow"></span>
      <span class="sum"></span>
      <button class="x">閉じる</button>
    </div>
    <div class="body">
      <div class="month">
        <div class="dow"><i>月</i><i>火</i><i>水</i><i>木</i><i>金</i><i class="sat">土</i><i class="sun">日</i></div>
        <div class="days"></div>
      </div>
      <div class="side"></div>
    </div>
  </div></div>
  <div id="studio" hidden><div id="studiobox">
    <div class="hd">
      <span class="what">図を直す</span>
      <span class="kind"></span>
      <span class="grow"></span>
      <button id="studioswap">字で直す</button>
      <button id="studiocancel">やめる</button>
      <button id="studiook" title="⌘Enter">この形にする</button>
    </div>
    <div class="body">
      <div class="form"></div>
      <div class="see">
        <div class="view"></div>
        <div class="err" hidden></div>
      </div>
    </div>
  </div></div>
  <div id="tablebar" hidden>
    <button data-do="row+">行を足す</button>
    <button data-do="row-">行を消す</button>
    <span class="sep"></span>
    <button data-do="col+">列を足す</button>
    <button data-do="col-">列を消す</button>
    <span class="sep"></span>
    <button data-do="align:left" title="左に寄せる">⇤</button>
    <button data-do="align:center" title="真ん中に寄せる">⇔</button>
    <button data-do="align:right" title="右に寄せる">⇥</button>
  </div>
  <div id="say"></div>
  <script src="vendor/monaco/vs/loader.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
