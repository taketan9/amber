<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
<title>cian</title>
<style>
/* The look is the whole reason this build exists, so the type comes first.
   No web font: the point of Chromium here is that Windows draws text with
   DirectWrite, and asking for a downloaded font would throw that away. The
   stack names what each platform actually ships. */
:root {
  /* 白磁 — the default.
     Colour where it means something and nowhere else: a directory, a mark,
     the cursor. Everything else is spacing and a hairline. Rows are open
     enough to be read by somebody who does not live in a file manager, which
     is who this build is for. */
  --bg:        #f7f8f8;
  --pane:      #ffffff;
  --pane-off:  #f3f5f5;
  --line:      #e3e7e6;
  --text:      #2b3333;
  --dim:       #8b9493;
  --dir:       #17706a;
  --accent:    #0e9e8f;
  --accent-dim:#e6f1ef;
  --on-accent: #ffffff;
  --mark:      #bf6b34;
  --cell-h:    26px;
  --size:      15px;
  /* A Nerd Font first, because that is what cian-tui is read in and it is the
     one people said looked best of the three. Then the UI faces Windows and
     macOS ship, then anything. The last two are the safety net: `sans-serif`
     rather than nothing, so a miss lands on a gothic face and never on 明朝. */
  --face: "HackGen Console NF", "HackGen35 Console NF", "UDEV Gothic NF",
          "Cica", "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP",
          system-ui, sans-serif;
}

/* Solarized Light — Ethan Schoonover's palette, unaltered.
   The one preset that exists on both sides: cian-tui has it too, so this is
   the only way to have the terminal and the window in the same colours. */
:root[data-look="solarized-light"] {
  --bg:        #fdf6e3;
  --pane:      #fdf6e3;
  --pane-off:  #f4eeda;
  --line:      #ddd6c1;
  --text:      #586e75;
  --dim:       #93a1a1;
  --dir:       #268bd2;
  --accent:    #2aa198;
  --accent-dim:#eee8d5;
  --on-accent: #fdf6e3;
  --mark:      #b58900;
}

/* 陰翳 — dark kept dark, and only what matters catches the light.
   The ground is not black but a deep brown; one gold and one vermilion. */
:root[data-look="inei"] {
  --bg:        #14110f;
  --pane:      #1c1714;
  --pane-off:  #161211;
  --line:      #2b2320;
  --text:      #d9d0c5;
  --dim:       #7c6f64;
  --dir:       #c9a227;
  --accent:    #e8b84b;
  --accent-dim:#2e2519;
  --on-accent: #1a1409;
  --mark:      #c8703c;
}

/* 端末譲り — the terminal build, not disowned.
   Monospace throughout, rows tight, ANSI bright colours as they are. */
:root[data-look="terminal"] {
  --bg:        #0c0c0c;
  --pane:      #111111;
  --pane-off:  #0d0d0d;
  --line:      #232323;
  --text:      #c8c8c8;
  --dim:       #6a6a6a;
  --dir:       #5fafff;
  --accent:    #5fffd7;
  --accent-dim:#1c2a28;
  --on-accent: #04120f;
  --mark:      #ffd75f;
  --cell-h:    19px;
  --size:      14px;
  --face: "HackGen Console NF", "UDEV Gothic NF", "Cica",
          ui-monospace, "Consolas", monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  /* Written out rather than as the `font` shorthand. The shorthand takes a
     size and a family together, and one unparseable piece throws away the
     whole declaration — which lands on the browser default, and on Japanese
     Windows that default is 明朝. Three properties fail one at a time. */
  font-family: var(--face);
  font-size: var(--size);
  line-height: var(--cell-h);
  /* A file manager is not a document: nothing here should be draggable text. */
  user-select: none; cursor: default;
  overflow: hidden;
}
#panes { display: flex; height: 100%; gap: 1px; background: var(--line); }
.pane {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
  background: var(--pane-off);
}
.pane.active { background: var(--pane); }
.crumb {
  padding: 6px 10px; border-bottom: 1px solid var(--line);
  color: var(--dim); font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  /* The path is the one thing here worth copying out. */
  user-select: text; cursor: text;
}
.pane.active .crumb { color: var(--accent); }
.rows { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
.row {
  display: flex; align-items: center; gap: 8px;
  height: var(--cell-h); padding: 0 10px;
  white-space: nowrap;
}
.row .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.row .size { flex: 0 0 auto; color: var(--dim); font-variant-numeric: tabular-nums; }
.row.dir .name { color: var(--dir); }
.row.marked .name { color: var(--mark); }
.row.cursor { background: var(--accent-dim); }
.pane.active .row.cursor { background: var(--accent); color: var(--on-accent); }
.pane.active .row.cursor .size { color: var(--on-accent); }
.pane.active .row.cursor .name { color: var(--on-accent); }
#status {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 3px 10px; font-size: 12px;
  background: var(--line); color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#status.bad { background: #5a2233; color: #ffd7de; }
#status .run { color: var(--accent); }

#ask {
  position: fixed; inset: 0; display: flex;
  align-items: center; justify-content: center;
  background: rgba(6, 8, 14, .72);
}
#ask[hidden] { display: none; }
.sheet {
  min-width: 380px; max-width: 70vw;
  background: var(--pane); border: 1px solid var(--accent);
  border-radius: 6px; padding: 16px 18px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .5);
}
.sheet .head { color: var(--accent); margin-bottom: 10px; }
.sheet .body {
  color: var(--text); margin-bottom: 16px;
  max-height: 40vh; overflow-y: auto;
  /* The list of what is about to happen is the one thing here worth reading
     twice, and sometimes worth copying into a message to somebody. */
  user-select: text; cursor: text;
  white-space: pre-wrap; word-break: break-all;
}
.sheet .buttons { display: flex; gap: 8px; justify-content: flex-end; }
.sheet button {
  font: inherit; padding: 5px 14px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--pane-off); color: var(--text);
}
.sheet button.go { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.sheet .field {
  width: 100%; font: inherit; color: var(--text);
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px;
}
.sheet .field:focus { outline: none; border-color: var(--accent); }
.sheet button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div id="panes">
    <section class="pane active" data-pane="left">
      <div class="crumb"></div>
      <div class="rows"></div>
    </section>
    <section class="pane" data-pane="right">
      <div class="crumb"></div>
      <div class="rows"></div>
    </section>
  </div>
  <div id="status">…</div>

  <!-- The confirm. cian's spine is that nothing is lost by a slip, so every
       copy, move and delete goes through here — never a keystroke straight to
       the disk. -->
  <div id="ask" hidden>
    <div class="sheet">
      <div class="head"></div>
      <div class="body"></div>
      <div class="buttons">
        <button data-answer="no">やめる  (Esc)</button>
        <button data-answer="yes" class="go">実行  (Enter)</button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
