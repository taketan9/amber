[package]
name = "cian-gui-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace root: this is a throwaway probe, and it must not drag wgpu
# and winit into cian's lockfile before the decision to use them is made.
[workspace]

[dependencies]
ratatui      = "0.30"
ratatui-wgpu = "0.5"
winit        = "0.30"
pollster     = "0.4"

[profile.release]
opt-level = 3
