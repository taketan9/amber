<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>amber</title>
  <!-- 案 S4「生成りの葉・尻尾つき」。多羅葉 ── 葉に字を書いたのが「葉書」の語源。
       葉脈は描かない。二行のあいだの隙間が葉脈に見えるので、描くと一本多い。
       葉は純白ではなく生成り（#fff4de）── 純白は琥珀の上でわずかに青く見える。
       この数字は packaging/amber.py と gui/renderer.js の cianMark() にも
       同じものが書いてある。**どれか一つだけ直すと必ずずれる。** -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="85" y2="100">
      <stop offset="0" stop-color="#ffd97f"/>
      <stop offset="1" stop-color="#f2a62c"/>
    </linearGradient>
    <clipPath id="c"><rect width="100" height="100" rx="26"/></clipPath>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <path d="M12 66 C6 74 0 84 -4 96" fill="none" stroke="#fff4de"
          stroke-width="7" stroke-linecap="round"/>
    <path d="M10 62 C6 38 26 18 50 15 C74 12 90 24 97 35 C88 50 66 68 44 77 C26 84 12 78 10 62 Z"
          fill="#fff4de"/>
    <!-- 書いた二行。地と同じ階調で抜くので、塗りではなく本当に地が透けて見える -->
    <g fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round">
      <path d="M24 46 C42 36 60 30 78 27"/>
      <path d="M24 66 C40 57 54 51 66 47"/>
    </g>
  </g>
</svg>
