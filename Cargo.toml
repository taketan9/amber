[workspace]
resolver = "2"
members = [
    "crates/amber-core",
    "crates/amber-ffi",
    "crates/amber-server",
]

[workspace.package]
# **番号を決めるのは Taketan。** 自分からは上げない。
# cian と別勘定 ── 分かれた日にどちらも 2.1.0 だったが、これ以降は別に進む。
version = "2.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
amber-core = { path = "crates/amber-core" }
anyhow     = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Xcode が繋ぐ静的ライブラリ。
#
# `release` は使えない。二つとも「繋がらないのに、理由を何も言わない
# ライブラリ」で終わる:
#
#   * `strip = "symbols"` が `_cian_call` と `_cian_free` を消す ── アプリが
#     繋いでいる理由そのものの二つ
#   * `lto = "thin"` が LLVM のビットコードを残す。Rust の LLVM は Xcode の
#     中のものより何世代も新しく、Apple の `nm` すら読めない
#     （"Unknown attribute kind"）。リンカも同じ年代
#
# 最適化はそのまま: これが電話に載るビルド。
[profile.ios]
inherits = "release"
lto = false
strip = false
