name: ci

# Runs on every push and pull request.
#
# The Windows job exists because cian is developed on macOS but shipped for
# Windows: platform-gated code and Cargo features only fail there, and the
# release workflow runs too late to catch it (it is triggered by hand, or by a
# tag, when you already believe the code is good). A `trash` feature that is
# mandatory on Windows once slipped through exactly this gap.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
