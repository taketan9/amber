name: release

# amber のエンジン（`amber-server`）を 3 つのプラットフォーム向けにビルドして、
# リリースに上げる。
#
# デスクトップ版の中身（`gui/`）は入れない。あれは Electron が読むただのファイルで、
# ビルドの必要がない。同梱する側（crmaine）がコピーすればよい。ここで配るのは
# 「ビルドしないと手に入らないもの」だけ。
#
# バージョンタグ（`v2.1.0`）を push するとリリースが出る。手動で実行したときは
# リリースを作らず、成果物だけ残す。公開せずにビルドの通りだけ確認できる。
#
#     git tag v2.1.0 && git push --tags     # 出す
#     gh workflow run release.yml           # 組み方だけ確かめる

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # タグと `Cargo.toml` が食い違うと、`version` が別の数字を返す実行ファイルが
  # そのリリースに付く。直せるのは、タグを動かせるこの時点だけ。
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: タグと Cargo.toml が合っているか
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "タグ $tag / Cargo.toml $crate"
          [ "$tag" = "$crate" ] || { echo "食い違っています"; exit 1; }

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows が主な配布先。会社の Windows 端末はネットに出られないので、
          # ダウンロードして置くだけで動く実行ファイルが要る。
          - os: windows-latest
            name: amber-server-win-x64.exe
            from: target/release/amber-server.exe
          # mac は 2 つのアーキテクチャを 1 つにまとめる（universal）。runner は
          # Apple シリコンなので、そのままビルドすると arm64 だけのバイナリになる。
          # Intel Mac にダウンロードした人の手元では Release のものが動かない
          # （実際に動かなかった）。`lipo` でまとめれば、どちらの Mac でも動く。
          - os: macos-latest
            name: amber-server-mac-universal
            from: target/universal/amber-server
            lipo: "yes"
          - os: ubuntu-latest
            name: amber-server-linux-x64
            from: target/release/amber-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # **Windows は CRT ごと静的に取り込む。**
      #
      # 既定の MSVC ビルドは `VCRUNTIME140.dll` を要る ── 素の Windows には
      # 入っていない（Visual C++ の再頒布可能パッケージが要る）。配布先は
      # ネットに出られない会社の端末で、**落として置くだけ**という運びなので、
      # 別途ランタイムが要る実行ファイルは配れない。
      #
      # 走らせるだけなら runner の上では通ってしまう（runner には redist が
      # 入っている）── 下の DLL の検査だけが、これを捕まえた。
      - name: ビルドする
        if: matrix.lipo != 'yes'
        run: cargo build --release -p amber-server
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}

      - name: 2 つビルドして 1 つにまとめる（mac）
        if: matrix.lipo == 'yes'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p amber-server --target aarch64-apple-darwin
          cargo build --release -p amber-server --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/amber-server \
            target/aarch64-apple-darwin/release/amber-server \
            target/x86_64-apple-darwin/release/amber-server
          # まとめたと言い張らずに確認する。片方しか入っていないバイナリは、
          # ダウンロードした人の環境でしか分からない。
          lipo -info target/universal/amber-server
          lipo -info target/universal/amber-server | grep -q arm64
          lipo -info target/universal/amber-server | grep -q x86_64

      # **一往復して、本当に話すか見る。** 組めたことと動くことは別で、
      # 動かないほうは配ったあとにしか出ない。`version` は何も要らない
      # 唯一の問いなので、煙を見るのにちょうどいい。
      # **判断の試験を、Windows の上でも回す。**
      #
      # パス区切りとキーボードの Enter で、mac では一生出ない不具合を 2 度出した
      # （依頼 342・344）。`win-test.js` はパスとキーの形を渡すだけなのでどの OS でも
      # 走るが、本物の Windows でも走らせておく。「渡した形」が本当に Windows の形
      # かどうかは、Windows でしか確かめられない。
      # 依存は要らない（`node_modules` は積まない）。
      - name: Windows の形を、Windows の上で
        if: runner.os == 'Windows'
        run: |
          node scripts/win-test.js
          node scripts/diagram-test.js
          node scripts/office-test.js

      # 「表示」モードが、入力しても文字を失わないか。
      #
      # HTML を組み立てるのは core（ビルドしたばかりの実行ファイル）、Markdown に
      # 戻すのはデスクトップ版と iPhone が共有しているコード。2 つの言語をまたぐ
      # ので、ここでしか回せない（`cargo test` は Rust 側しか見ない）。
      #
      # 依存が要る（jsdom）ので、デスクトップ版の `node_modules` がある mac だけで走らせる
      # ── 判断そのものは土台に依らないので、一台で足りる。
      - name: テキスト → 画面 → テキスト が、元に戻るか
        if: runner.os == 'macOS'
        run: |
          cp target/release/amber-server gui/amber-server || true
          (cd gui && npm ci)
          node scripts/paper-test.js
          node scripts/round-test.js
          node scripts/key-test.js
          node scripts/web-test.js
          node scripts/agree-test.js
          node scripts/paint-test.js
          node scripts/words-test.js
          node scripts/office-test.js

      # **Windows でも core の試験を回す。**
      #
      # 上の往復（`round-test` ほか）は文字列を渡すだけなので 1 台で足りるが、
      # `cargo test` はそうではない。core はファイルを開き、パスを組み立て、
      # 改行と文字コードを見る。そこは OS によって振る舞いが変わるところで、
      # 「mac では一生出ない」類を 4 度踏んでいる（`file://`・キー名・画像のパス・
      # 改行）。ビルドが通ることだけ見て済ませていたので、判断そのものを
      # Windows でも一度通す（依頼 434）。
      - name: core の試験（Windows）
        if: runner.os == 'Windows'
        run: cargo test --workspace
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'

      - name: 一往復してみる（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = '{"id":1,"method":"version","params":{}}' | & "${{ matrix.from }}"
          Write-Host $out
          if ($out -notmatch '"amber"') { throw "返事が version になっていません: $out" }

      - name: 一往復してみる（mac / Linux）
        if: runner.os != 'Windows'
        run: |
          out=$(echo '{"id":1,"method":"version","params":{}}' | ${{ matrix.from }})
          echo "$out"
          echo "$out" | grep -q '"amber"' || { echo "返事が version になっていません"; exit 1; }

      # 同梱する側は DLL を置けない。ダウンロードして置くだけ、という運用なので、
      # 別途ランタイムが要る実行ファイルを配ると、そこで止まる。
      - name: 余分な DLL を連れていないか（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem -Recurse -Filter dumpbin.exe `
            "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dumpbin) { Write-Host "dumpbin が見つからないので飛ばします"; exit 0 }
          $deps = & $dumpbin.FullName /dependents "${{ matrix.from }}" |
            Select-String -Pattern '\.dll$' | ForEach-Object { $_.ToString().Trim() }
          Write-Host ($deps -join "`n")
          # `api-ms-win-crt-*` は Windows 10 以降に元からある API セット。
          # 連れて歩けないのは、再頒布可能パッケージが要るものだけ。
          $bad = $deps | Where-Object { $_ -match 'libgcc|libwinpthread|libstdc\+\+|vcruntime|msvcp|msvcr\d' }
          if ($bad) { throw "同梱の要る DLL を連れています: $bad" }

      - name: 名前を付けて残す
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.from }}" "out/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error

      # **mac の予定表に話しかける道具**（依頼 462）。Electron からは
      # EventKit を呼べないので、小さな実行ファイルを一つ連れていく。
      # mac でしか組めないし、mac でしか要らない。
      - name: 予定表のツールをビルドする（mac）
        if: matrix.os == 'macos-latest'
        run: |
          ./scripts/mac-build.sh
          cp target/mac/amber-cal out/amber-cal-mac

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: amber-cal-mac
          path: out/amber-cal-mac
          if-no-files-found: error

  # 画面（`gui/`）を、そのまま置けば動く zip にまとめる。
  #
  # これはビルドしたものではなく、集めたもの。 `gui/` の中身は Electron が
  # 読むただのファイルで、要るのは `gui/vendor/` を積んである状態 ──
  # そこは git に入れていない（数メガの、決して変わらないもの）。同梱する側は
  # いま「タグのソースを落として `npm install` → `node gui/vendor.js`」を
  # やっていて、動いてはいるが**こちらがエディタの積み方を変えるたびに
  # 追随が要る**。積み終えた形で配れば、その追随が要らなくなる。
  #
  # `packaging/amber-mark.png` も同じ zip に入れる。画面はアイコンを
  # `../packaging/amber-mark.png` と指しているので、`gui/` だけではアイコンの
  # 出ない画面になる。
  #
  # サンプルノート（`packaging/welcome/`）も入れる。「サンプルノートを入れる」は
  # `<画面の隣>/../packaging/welcome` をコピーする処理なので、入れておかないと、
  # 同梱した側でそれを実行した人に「サンプルが入っていません」が出る（実際に出た）。
  # 同梱する側にコピーを置かせない、というのはあちら側の方針でもある
  # （コピーを持つと、amber を入れ替えたときに古いサンプルが残る）。
  #
  # **`node_modules` は入れない。** あそこには Electron 本体（200MB 超）が
  # 居て、同梱する側は自分の Electron の中でこの画面を動かす。
  # `amber-server` も入れない。実行ファイルは OS ごとに別で、
  # 置く場所（画面の隣）は同梱する側が決めている。
  screen:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # **`npm ci` で積む（`npm install` ではなく）。**
      #
      # `npm install` は `package-lock.json` を**書き直す**ことがある ──
      # 書き直された lock がそのまま zip に入り、配布物の中に
      # **どのコミットにも無いファイル**が混ざっていた（v2.7.1 で 100 バイト
      # ずれていて、同梱する側が「同じタグでも組み直すと lock がずれる」と
      # 気づいた）。`npm ci` は lock のとおりに入れ、lock を触らない。
      # 噛み合っていなければその場で失敗する。黙ってずれるより、失敗するほうがいい。
      - name: エディタと図を積む
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          node vendor.js

      - name: 積み終えたか、見る
        run: |
          for f in gui/vendor/monaco/vs/loader.js \
                   gui/vendor/monaco-vim/monaco-vim.umd.js \
                   gui/vendor/mermaid/mermaid.min.js \
                   packaging/amber-mark.png; do
            [ -f "$f" ] || { echo "ありません: $f"; exit 1; }
          done
          # サンプルは枚数で確認する。1 つも無いフォルダは、「入れた」と
          # 「入っていない」が同じ見た目になる。
          n=$(find packaging/welcome -name '*.md' | wc -l)
          [ "$n" -ge 1 ] || { echo "サンプルノートがありません"; exit 1; }
          echo "サンプル $n 件"
          # 積み忘れは「ウィンドウは開くが中身が真っ白」という形で出る。数えて報告する。
          echo "monaco $(du -sh gui/vendor/monaco | cut -f1) / mermaid $(du -sh gui/vendor/mermaid | cut -f1)"

      - name: 同梱する側との約束を確かめる
        run: node scripts/contract.js

      # `zip` コマンドではなく Python で作る。サンプルノートの名前は日本語で、
      # 1 つは `ambər へようこそ.md`（シュワー入り）。Info-ZIP の `zip` は既定で
      # UTF-8 フラグを立てないので、日本語 Windows で展開すると名前が化ける。
      # `-UN=UTF8` で立つが、Apple が同梱している zip はそのオプションを知らない。
      # 手元で試せないものを、ここにだけ書くことになる。作ったあと自分で開いて
      # 数えるところまで、そのスクリプトの中に入っている。
      - name: zip にまとめる
        run: python3 packaging/gui_zip.py out/amber-gui.zip

      - uses: actions/upload-artifact@v4
        with:
          name: amber-gui.zip
          path: out/amber-gui.zip
          if-no-files-found: error

  # 展開するだけで動く Windows 版（依頼 553）。
  #
  # 配布先は**ネットに出られない会社の端末**で、そこには git も gh も無く、
  # ダウンロードできるのは GitHub の Release の zip だけ。なので「持ち込んでビルド」
  # ではなく、ビルド済みのものを置く。ビルドスクリプト（`scripts/pack.js`）は
  # 手元でもここでも同じものを通る。
  #
  # ここでしかビルドできない理由が 2 つある:
  #
  # - `gui/vendor/` は git に入っていない（`npm install` が置いたものをコピーする
  #   形）ので、ネットに出られない環境では作れない
  # - exe のアイコンと名前は PE のリソースなので、`rcedit` を Windows の上で
  #   掛けるしかない
  windows:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # エンジンは matrix 側がビルドして置いたものを使い、ここでビルドし直さない
      # （2 度ビルドすると、配布物と成果物が別物になりうる）。
      - uses: actions/download-artifact@v4
        with:
          name: amber-server-win-x64.exe
          path: engine

      # **`npm ci` で積む**（`screen` と同じ理由 ── lock を書き換えない）。
      - name: エディタと図を積む
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          node vendor.js

      # **Electron の版は lock から取る。** ここに数字を書くと、`package.json`
      # を上げたときにここだけ古いまま残り、画面と本体でバージョンの違うビルドができる
      # ── その食い違いは、配ったあとにしか出ない。
      - name: Electron を落として展開する
        shell: pwsh
        run: |
          $v = (Get-Content gui/node_modules/electron/package.json | ConvertFrom-Json).version
          Write-Host "Electron $v"
          $url = "https://github.com/electron/electron/releases/download/v$v/electron-v$v-win32-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile electron.zip
          Expand-Archive electron.zip -DestinationPath electron-dist
          if (-not (Test-Path electron-dist/electron.exe)) { throw "electron.exe がありません" }

      - name: rcedit を落とす
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe `
            -OutFile rcedit-x64.exe

      - name: ビルドする
        run: >
          node scripts/pack.js --out dist --platform win32
          --electron electron-dist
          --engine engine/amber-server-win-x64.exe
          --rcedit rcedit-x64.exe
          --zip

      # **出口で数える。** `pack.js` も中身を数えるが、こちらは
      # Windows でしか分からないところを見る。アイコンと名前が埋め込まれたか。
      - name: 埋め込まれたか、数えたか
        shell: pwsh
        run: |
          $exe = Get-Item dist/amber-win-x64/amber.exe
          $name = $exe.VersionInfo.ProductName
          Write-Host "ProductName: $name"
          if ($name -ne 'ambər') { throw "exe の名前が埋め込まれていません: $name" }
          $zip = Get-ChildItem dist/amber-win-x64-*.zip
          if (-not $zip) { throw "zip がありません" }
          Write-Host ("{0}  {1:N1} MB" -f $zip.Name, ($zip.Length / 1MB))
          # 展開するだけで動く配布物なので、必要なものが中にあるかを見る。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $z.Entries | ForEach-Object { $_.FullName }
          $z.Dispose()
          foreach ($need in @(
              'amber-win-x64/amber.exe',
              'amber-win-x64/resources/app/gui/main.js',
              'amber-win-x64/resources/app/gui/amber-server.exe',
              'amber-win-x64/resources/app/gui/vendor/monaco/vs/loader.js',
              'amber-win-x64/resources/app/gui/vendor/mermaid/mermaid.min.js',
              'amber-win-x64/resources/app/packaging/welcome',
              'amber-win-x64/はじめにお読みください.txt')) {
            if (-not ($names | Where-Object { $_ -like "$need*" })) { throw "zip に入っていません: $need" }
          }
          Write-Host ("中身 {0} 件" -f $names.Count)

      - uses: actions/upload-artifact@v4
        with:
          name: amber-win-x64.zip
          path: dist/amber-win-x64-*.zip
          if-no-files-found: error

      # 会社向けのビルド（依頼 602・本人「会社でビルドする際には、同期に
      # 関する機能や表示はすべてクローズにしたい」「Asset にアップしてもらう
      # 資材には見えないまたは機能を削ぎ落としたものにしてほしい」）。
      #
      # 中身は上と同じで、違うのは `gui/edition.json` が 1 つ入ることだけ。
      # 画面がそれを見て、外部と通信するもの（Google Drive の同期・iCal の購読・
      # グループ共有）を表示しないし実行しない。
      #
      # 名前もフォルダも分ける。リリースの成果物は 1 つのディレクトリに平らに
      # 並ぶので、同じ名前なら片方が片方を黙って上書きする（落とした人には
      # どちらを手にしたのか分からない）。`pack.js` が名前に `-office` を
      # 入れ、ここは別のフォルダへ出す ── 上の `amber-win-x64-*.zip` が
      # 会社向けのほうまで掴まないように。
      - name: 会社向けにもう 1 つビルドする
        run: >
          node scripts/pack.js --out dist-office --platform win32
          --edition office
          --electron electron-dist
          --engine engine/amber-server-win-x64.exe
          --rcedit rcedit-x64.exe
          --zip

      - name: 会社向けのビルドに、版の目印が入ったか
        shell: pwsh
        run: |
          $at = 'dist-office/amber-win-x64-office/resources/app/gui/edition.json'
          if (-not (Test-Path $at)) { throw "版の目印がありません: $at" }
          $got = (Get-Content $at | ConvertFrom-Json).edition
          Write-Host "edition: $got"
          if ($got -ne 'office') { throw "版が office ではありません: $got" }
          # 通常のビルドには入っていないことも見る。両方に入っていたら、
          # 配布物すべてから同期が消える。
          if (Test-Path 'dist/amber-win-x64/resources/app/gui/edition.json') {
            throw "通常のビルドにも版の目印が入っています"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: amber-win-x64-office.zip
          path: dist-office/amber-win-x64-office-*.zip
          if-no-files-found: error

      # 会社へ持ち込む一式（`amber-src.zip`・依頼 639・本人「資材をもちこむ
      # だけにして、社内ではビルドするだけにしたい」）。
      #
      # 中身は画面（`gui/vendor` ごと ＝ npm が不要）・アイコンとサンプル・
      # ビルドスクリプト・エンジンの実行ファイル（＝ Rust が不要）。Electron は
      # 入れない。会社には cian のぶんが既にあり、100MB を毎回配る意味がない。
      - name: 持ち込む一式を作る
        run: node scripts/src-zip.js --engine engine/amber-server-win-x64.exe --out out/amber-src.zip

      # 会社と同じ手順を、ここで一度通す。
      #
      # 一式を配って「あちらでビルドしたら落ちた」がいちばん高くつく。展開して、
      # 会社で叩くのと同じコマンドを叩き、3 つできたかを数える。Windows の上で
      # やるのは、あの環境で動くことを確認したいから（`Compress-Archive` の
      # 文字化けも、パス区切りも、ここでしか出ない）。
      - name: 一式から、会社と同じ手順でビルドしてみる
        shell: pwsh
        run: |
          Expand-Archive out/amber-src.zip -DestinationPath try
          Push-Location try/amber-src
          node scripts/build-win.js --electron $env:GITHUB_WORKSPACE/electron-dist --out dist
          Pop-Location
          $v = (Get-Content gui/package.json | ConvertFrom-Json).version
          foreach ($f in @('amber-gui.zip', 'amber-server-win-x64.exe.zip', "amber-win-x64-office-$v.zip")) {
            $at = "try/amber-src/dist/$f"
            if (-not (Test-Path $at)) { throw "一式から組めていません: $f" }
            Write-Host ("{0}  {1:N0} KB" -f $f, ((Get-Item $at).Length / 1KB))
          }
          # 会社向けの目印が入っているか。一式からビルドしたものでも確かめる。
          Expand-Archive "try/amber-src/dist/amber-win-x64-office-$v.zip" -DestinationPath try/out
          $at = 'try/out/amber-win-x64-office/resources/app/gui/edition.json'
          if (-not (Test-Path $at)) { throw "一式からビルドしたものに、版の目印がありません" }

      - uses: actions/upload-artifact@v4
        with:
          name: amber-src.zip
          path: out/amber-src.zip
          if-no-files-found: error

  # 会社で修正・ビルド・テストするための一式（`amber-dev.zip`・依頼 640）。
  #
  # 軽いほう（`amber-src.zip`）はビルドするだけ。こちらは Rust のコードまで
  # 修正できる一式なので、分けてある（本人が決めた）。
  #
  # Rust は自己完結版（windows-gnu）を使う。会社の端末に Visual Studio が
  # 入っているか分からないため。MSVC 版は VS の Build Tools が別に要る。
  # ここで、そのビルド方法で本当にビルドできるかを毎回確かめてからまとめる。
  devkit:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 画面のライブラリ（`gui/vendor`）も一式に入れる。あれは git に入っていない。
      - name: エディタと図を積む
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          node vendor.js

      - uses: actions/download-artifact@v4
        with:
          name: amber-server-win-x64.exe
          path: engine

      # **自己完結版で本当に組めるか。** ここが通らないなら、358MB を運んで
      # もらう意味が無い（会社で初めて分かるのがいちばん高くつく）。
      - name: 自己完結版（gnu）で、エンジンをビルドしてみる
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --release -p amber-server --target x86_64-pc-windows-gnu
        shell: bash

      - name: 組めたか、動くか
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-gnu/release/amber-server.exe'
          if (-not (Test-Path $exe)) { throw "組めていません: $exe" }
          $out = '{"id":1,"method":"version","params":{}}' | & $exe
          Write-Host $out
          if ($out -notmatch '"ok"') { throw "答えません: $out" }

      # 依存の実体（`cargo vendor`）。会社ではネットに出られないので、丸ごと運ぶ。
      - name: 依存を取り寄せる
        run: cargo vendor vendor
        shell: bash

      # 配る URL が本当に存在するか、ここで一度叩く。
      #
      # 375MB を同梱するのをやめた代わりが、案内の URL 1 行だけになった。
      # 会社で「ダウンロードしたら無かった」と分かるのが、いちばん高くつく。
      # 中身は不要なので HEAD だけ投げて、ファイル 1 つ分のサイズが返るかを見る
      # （404 のページも 200 で返すネットワークがあるので、存在確認だけでは足りない）。
      - name: Rust の落とし先が在るか
        shell: bash
        run: |
          v=$(rustc --version | cut -d' ' -f2)
          url="https://static.rust-lang.org/dist/rust-$v-x86_64-pc-windows-gnu.msi"
          echo "$url"
          # curl をパイプに通さない。`curl | awk` だと終了コードは awk のものに
          # なり、404 でも 0 が返る。`-f` も `set -e` も効かなくなる（書いた直後に
          # 99.99.99 で試したら、404 ページの 335 バイトを掴んで「存在します」と
          # 言った）。先に受け取って、取得できたかを自分で確認する。
          head=$(curl -fsS -I "$url") || { echo "落とせません（404 など）: $url"; exit 1; }
          n=$(printf '%s' "$head" | tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }')
          case "$n" in ''|*[!0-9]*) echo "大きさが返りません: '$n'"; exit 1;; esac
          # 404 ページもサイズは返す。ファイル 1 つ分あるかまで確認する。
          [ "$n" -gt 100000000 ] || { echo "ファイル 1 つ分のサイズがありません: $n バイト"; exit 1; }
          echo "$((n / 1000000)) MB"

      # Rust 本体（375MB）は同梱しない（依頼 641・本人が決めた）。
      #
      # あれは amber のバージョンが変わっても 1 バイトも変わらないので、バージョン
      # ごとに置き直すと同じ 375MB がタグの数だけ積み上がる（v3.1.2〜v3.1.7 で実際に
      # 1.66GB 積んで、消した）。代わりに、バージョンを埋め込んだ URL を一式の
      # 「はじめに読んでください」に書く。ネットに出られないのは会社の端末で、
      # ダウンロードする人の手元は外に出られる。ダウンロードするのは一度だけ。
      #
      # バージョンは、ここでビルドに使った rustc のものをそのまま渡す。上のステップで
      # 「自己完結版でビルドできた」を確認した Rust と、会社に入る Rust が同じになる。
      - name: 一式を作る
        shell: bash
        run: |
          v=$(rustc --version | cut -d' ' -f2)
          node scripts/dev-kit.js --rust-version "$v" --vendor vendor \
            --engine engine/amber-server-win-x64.exe --out out/amber-dev.zip

      - uses: actions/upload-artifact@v4
        with:
          name: amber-dev.zip
          path: out/amber-dev.zip
          if-no-files-found: error

  # タグを push したときだけリリースする。手動実行した回は成果物だけ残す。
  publish:
    needs: [build, screen, windows, devkit]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      # Release に置くのは、その環境で作れないものだけ（依頼 641）。
      #
      # 会社の端末へ持ち込む手順が「`amber-src.zip` を運んで、あちらで
      # `node scripts\build-win.js --electron <Electron>` を叩く」に決まった時点で、
      # Windows のビルド済み 2 つ（`amber-win-x64-<版>.zip` と
      # `amber-win-x64-office-<版>.zip`・計 252MB）は、あの環境が自分でビルド
      # できるものになった。作れるものを置いても、ダウンロードする人はいない。
      #
      # 外したもの、それぞれの理由:
      #
      #   * `amber-win-x64-office-<版>.zip` … 会社でビルドできる（既定がこちら）
      #   * `amber-win-x64-<版>.zip`        … `--full` でビルドできる。そのうえ本人が
      #                                       「Windows に同期と Google カレンダーは不要」
      #   * 素の `amber-server-*` 3 つ      … zip が通るネットワークは素の実行ファイルも
      #                                       通すが、逆は通らない
      #   * mac / Linux のエンジン          … 本人の Mac で `cargo build` すれば作れる
      #   * `amber-cal-mac`                 … `mac/amber-cal.swift` から手元で作れる
      #
      # ジョブは何も削っていない。成果物は今までどおり全部アップロードされるので、
      # mac 向けのものが要るときは `gh run download` で取れる。Release に付くのが
      # 下の 4 つだけになる。
      #
      # zip は今までどおり 3 つとも作る（作るステップは動かさない。動かすと
      # 「1 つだけ入っているか」の確認まで触ることになる）。不要なものは作った
      # あとで削除する。
      #
      # zip の直下にファイル 1 つ・名前はそのまま（`-j`）。取り出した人が名前を
      # 直さずに置けるようにするため。`-X` は付けない。mac と Linux の実行権限
      # （+x）まで落ちて、取り出した人が `chmod` する羽目になる。
      - name: 一つにまとめる
        run: |
          mkdir -p out
          find dl -type f -exec cp {} out/ \;
          cd out
          for f in amber-server-*; do
            case "$f" in *.zip) continue;; esac
            chmod +x "$f"
            zip -j -q "$f.zip" "$f"
            # 入れたつもりで空、を配らない。1 つだけ入っているか数える。
            [ "$(unzip -Z1 "$f.zip" | wc -l)" -eq 1 ] || { echo "$f.zip の中身が 1 件ではありません"; exit 1; }
            unzip -Z1 "$f.zip" | grep -qx "$f" || { echo "$f.zip の中の名前が違います"; exit 1; }
          done

      # **足し算で選ぶ。** 「この名前は置かない」の引き算だと、明日 CI が
      # 増やした資材が黙って Release に混ざる（`amber-dev.zip` を包むときに
      # 同じ形で踏んだ）。名を挙げたものだけ残す。
      #
      # **指紋は、絞ったあとで書く** ── 置かないものの指紋が並んでいたら、
      # 落とした人は「落とし損ねた」と読む。
      - name: Release に出すものだけ残して、指紋を書く
        run: |
          cd out
          keep="amber-src.zip amber-gui.zip amber-server-win-x64.exe.zip amber-dev.zip"
          # 揃っていなければ、リリースを作らずに止める。足りないファイルは
          # 「ダウンロードできない」ではなく「無いことに気づかない」形で出る。
          for f in $keep; do
            [ -f "$f" ] || { echo "出すはずのものがありません: $f"; exit 1; }
          done
          for f in *; do
            case " $keep " in *" $f "*) continue;; esac
            echo "置かない: $f"
            rm -f "$f"
          done
          sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # **資材の名前が変わったら、リリースノートの頭に書く**（crmaine から・
      # 2026-09-22）。v3.2.0 で `amber-server-win-x64.exe` が `.exe.zip` に
      # 変わったとき、どこにも書かなかったので、**取り寄せる側（crmaine）が
      # 黙って止まった**。
      #
      # **憶えておく約束にしない** ── 「変えたら書く」を決まりにしても、忘れた日に
      # 何も鳴らない。一つ前のリリースの資材の名前と自動で見比べ、違えば頭に
      # 書く。**変わらなくても一覧は毎回書く**（取り寄せる側が、いま何が
      # 置いてあるかを一目で読めるように）。
      - name: 資材の名前が変わっていないか、一つ前と見比べる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 版の入った名前（`amber-win-x64-3.1.8.zip`）は毎回変わるので、版を
          # 伏せてから見比べる ── 伏せないと、形が同じでも毎回「変わった」と言う。
          mask() { sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+/-<版>/g'; }
          now=$(cd out && ls -1 | sort)
          prev_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          before=""
          if [ -n "$prev_tag" ]; then
            before=$(gh release view "$prev_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | sort || true)
          fi
          gone=$(comm -23 <(printf '%s\n' "$before" | sed '/^$/d' | mask | sort -u) <(printf '%s\n' "$now" | mask | sort -u))
          came=$(comm -13 <(printf '%s\n' "$before" | sed '/^$/d' | mask | sort -u) <(printf '%s\n' "$now" | mask | sort -u))
          {
            if [ -n "$before" ] && { [ -n "$gone" ] || [ -n "$came" ]; }; then
              echo "## ⚠ 資材の名前が変わりました（$prev_tag から）"
              echo
              echo "取り寄せている道具がある場合は、名前を合わせてください。"
              echo
              [ -n "$gone" ] && printf '%s\n' "$gone" | sed 's/^/- なくなった: `/; s/$/`/'
              [ -n "$came" ] && printf '%s\n' "$came" | sed 's/^/- 増えた: `/; s/$/`/'
              echo
            fi
            echo "## 置いてある資材"
            echo
            printf '%s\n' "$now" | sed 's/^/- `/; s/$/`/'
            echo
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: release-notes.md
          generate_release_notes: true
