name: release

# Builds the three downloads and publishes them as one GitHub Release.
#
# Trigger it by pushing a version tag (`git tag v1.0.6 && git push --tags`), or
# by hand from the Actions tab. A tag publishes a release; a manual run only
# leaves the packages as workflow artifacts, which is the way to rehearse the
# build without announcing anything.
#
# Each platform job stages a package and uploads it as an artifact. One publish
# job at the end gathers all three, writes the checksums over the finished set,
# and creates the release. That ordering matters: when each job attached its own
# file, three jobs raced to create the same release, and the notes came out
# belonging to whichever finished first.

on:
  push:
    tags:
      # Both spellings: the first releases here were tagged `1.0.0`, with no
      # prefix, and a workflow that only answered to `v*` would sit still while
      # someone waited for it.
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag that disagrees with Cargo.toml ships binaries whose `:version` says
  # something other than the release they are attached to. Cheap to check, and
  # the only moment it can still be fixed by moving the tag.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag and Cargo.toml have to agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag $tag, Cargo.toml $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match the workspace version $crate"
            exit 1
          fi

  # The window build for a Mac, as a double-clickable .app. This is the one to
  # download to try `cian` on a real machine; `cian-tui` rides along in the same
  # zip for the terminal.
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Both architectures, because the runner is one of them and half the
      # Macs in the world are the other. An arm64-only bundle on an Intel Mac
      # does not fail to run, it fails to *open*: "このMacには対応していない",
      # with nothing to say which Mac it was built for.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch the bundled font
        run: |
          mkdir -p crates/cian-gui/fonts
          curl -sL -o font.zip "$FONT_URL"
          unzip -q font.zip -d font
          cp "$(find font -name 'HackGenConsoleNF-Regular.ttf' | head -1)" crates/cian-gui/fonts/cian.ttf
        env:
          FONT_URL: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip

      - name: Build (release, both architectures)
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" --bin cian-tui
            cargo build --release --target "$target" --bin cian-server
            cargo build --release --target "$target" --bin cian --features cian-gui/bundled-font
          done

      # One binary that holds both, where the bundler and the zip expect to
      # find it. `lipo` is what "universal" means: the two builds glued into
      # one file, and macOS picks the slice it can run.
      - name: Make them universal
        run: |
          mkdir -p target/release
          for bin in cian cian-tui cian-server; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "target/release/$bin"
            lipo -info "target/release/$bin"
          done

      - name: Bundle and stage
        run: |
          ./packaging/macos/bundle.sh
          stage=cian-macos
          mkdir -p "$stage/examples"
          cp -R target/cian.app "$stage/"
          cp target/release/cian-tui target/release/cian-server "$stage/"
          cp examples/init.lua "$stage/examples/"
          cp README.md README.ja.md LICENSE "$stage/"
          # The quarantine catches everyone who downloads this, and cian is
          # not notarised. The fix belongs where they will look for it — in
          # the folder, not on line 30 of a manual.
          cp packaging/macos/README.txt "$stage/"
          # Zipped with ditto so the .app keeps its permissions and the
          # ad-hoc signature survives the round trip.
          ditto -c -k --sequesterRsrc --keepParent "$stage" cian-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cian-macos
          path: cian-macos.zip

  windows-x64:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The window build embeds a font so the download needs nothing
      # installed to run. Fetched here rather than committed: it is twelve
      # megabytes that would sit in every clone forever.
      - name: Fetch the bundled font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/cian-gui/fonts | Out-Null
          Invoke-WebRequest -Uri "$env:FONT_URL" -OutFile font.zip
          Expand-Archive font.zip -DestinationPath font
          Copy-Item (Get-ChildItem -Recurse -Filter "HackGenConsoleNF-Regular.ttf" font)[0].FullName crates/cian-gui/fonts/cian.ttf
        env:
          FONT_URL: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip

      - name: Build (release)
        run: |
          cargo build --release --bin cian-tui
          cargo build --release --bin cian-server
          cargo build --release --bin cian --features cian-gui/bundled-font

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "cian-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/cian.exe $stage/
          Copy-Item target/release/cian-tui.exe $stage/
          Copy-Item target/release/cian-server.exe $stage/
          Copy-Item packaging/windows/install.ps1 $stage/
          Copy-Item packaging/windows/README.txt $stage/
          Copy-Item README.md, README.ja.md, LICENSE $stage/
          New-Item -ItemType Directory -Force -Path "$stage/examples" | Out-Null
          Copy-Item examples/init.lua "$stage/examples/"
          Compress-Archive -Path "$stage/*" -DestinationPath "cian-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cian-windows-x64
          path: cian-windows-x64.zip

  # The readme has said macOS, Windows and Linux since the first commit, and
  # the release shipped two of them. A tarball rather than a zip, because that
  # is what a Linux user's hands already know.
  linux-x64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch the bundled font
        run: |
          mkdir -p crates/cian-gui/fonts
          curl -sL -o font.zip "$FONT_URL"
          unzip -q font.zip -d font
          cp "$(find font -name 'HackGenConsoleNF-Regular.ttf' | head -1)" crates/cian-gui/fonts/cian.ttf
        env:
          FONT_URL: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip

      - name: Build (release)
        run: |
          cargo build --release --bin cian-tui
          cargo build --release --bin cian-server
          cargo build --release --bin cian --features cian-gui/bundled-font

      - name: Stage package
        run: |
          stage=cian-linux-x64
          mkdir -p "$stage/examples"
          cp target/release/cian target/release/cian-tui target/release/cian-server "$stage/"
          cp examples/init.lua "$stage/examples/"
          cp README.md README.ja.md LICENSE "$stage/"
          tar czf cian-linux-x64.tar.gz "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cian-linux-x64
          path: cian-linux-x64.tar.gz

  # The whole of cian as one file that builds with no network at all: the
  # source, and every crate it depends on already downloaded. This is what
  # goes in-house, where the point is to change cian rather than to run it.
  #
  # Vendored on Linux although the target is Windows — `cargo vendor` works
  # from Cargo.lock, which lists every platform's crates, so the tree it
  # writes is not the runner's. The job after this one proves that on a real
  # Windows machine rather than trusting it.
  source-offline:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Carried, not fetched. A build behind a company firewall cannot reach
      # GitHub for it, and without it the window build has no font.
      - name: Fetch the bundled font
        run: |
          mkdir -p crates/cian-gui/fonts
          curl -sL -o font.zip "$FONT_URL"
          unzip -q font.zip -d font
          cp "$(find font -name 'HackGenConsoleNF-Regular.ttf' | head -1)" crates/cian-gui/fonts/cian.ttf
        env:
          FONT_URL: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip

      - name: Vendor every dependency
        run: |
          mkdir -p .cargo
          cargo vendor --versioned-dirs vendor > .cargo/config.toml
          echo "vendored crates: $(ls vendor | wc -l)"
          du -sh vendor

      - name: Stage the bundle
        run: |
          stage=cian-source-offline
          mkdir -p "$stage"
          # The tracked tree, exactly — no target/, no .git, nothing local.
          git archive HEAD | tar -x -C "$stage"
          cp -R vendor .cargo "$stage/"
          mkdir -p "$stage/crates/cian-gui/fonts"
          cp crates/cian-gui/fonts/cian.ttf "$stage/crates/cian-gui/fonts/"
          cp packaging/offline/README.txt "$stage/"
          {
            echo "cian $(git describe --tags --always)"
            echo "commit $(git rev-parse HEAD)"
            echo "vendored $(date -u +%Y-%m-%dT%H:%M:%SZ) with $(rustc -V)"
            echo
            echo "Build with this version of Rust or newer."
          } > "$stage/BUILT-WITH.txt"
          zip -qr cian-source-offline.zip "$stage"
          du -sh cian-source-offline.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cian-source-offline
          path: cian-source-offline.zip

  # Does the bundle actually build with nothing but itself? `--offline` makes
  # cargo fail rather than quietly reach crates.io, so a green run here is the
  # claim the package makes, tested on the platform it is for.
  source-offline-check:
    needs: source-offline
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: cian-source-offline

      - uses: dtolnay/rust-toolchain@stable

      - name: Unpack
        shell: pwsh
        run: Expand-Archive cian-source-offline.zip -DestinationPath .

      - name: Build it with cargo cut off from the network
        shell: pwsh
        working-directory: cian-source-offline
        run: cargo build --release --offline --bin cian-tui --bin cian-server

      # The window build pulls in wgpu and winit, which the terminal build
      # never touches — vendoring that missed them would pass the step above
      # and fail in-house. Checked rather than built: it walks the whole of
      # that dependency graph, which is the thing in question, without paying
      # for the link.
      - name: And the window build's dependencies too
        shell: pwsh
        working-directory: cian-source-offline
        run: cargo check --release --offline --bin cian --features cian-gui/bundled-font

  # One release, made once, over the finished set of packages.
  publish:
    needs: [macos, windows-x64, linux-x64, source-offline-check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      # A Windows machine cut off from the network is the one that most needs
      # to know its zip arrived whole. `sha256sum -c SHA256SUMS` on the far
      # side, or `Get-FileHash` on Windows itself.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum cian-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
